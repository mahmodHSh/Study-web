<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#f6f7fb" />
<meta name="description" content="مكتبة الدراسة — نظّم ملفات دراستك وواجباتك وتابع درجاتك وأخطاءك." />
<title>مكتبة الدراسة</title>
<script>try{var t=localStorage.getItem("sm-theme")||"light";document.documentElement.setAttribute("data-theme",t);if(t==="dark")document.querySelector('meta[name=theme-color]').content="#0a0d14";}catch(e){document.documentElement.setAttribute("data-theme","light");}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" />
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
/* Fonts (Cairo + IBM Plex Mono) are loaded via <link> in index.html, not @import. */

:root {
  color-scheme: light;
  --bg: #f6f7fb; --surface: #ffffff; --surface-2: #f1f3f9; --surface-3: #e8ecf5;
  --border: #d9dfec; --border-soft: #e6e9f2;
  --text: #1b2233; --muted: #5a6478; --faint: #8790a3;
  --accent: #2f6fed; --accent-soft: rgba(47, 111, 237, 0.1);
  --success: #12a173; --success-soft: rgba(18, 161, 115, 0.12); --warning: #b9740a;
  --overlay: rgba(20, 28, 45, 0.45); --scroll: #cfd5e3; --scroll-hover: #b8c0d3;
  --shadow: 0 1px 2px rgba(27, 34, 51, 0.05), 0 4px 14px rgba(27, 34, 51, 0.05);
}
:root[data-theme="dark"] {
  --bg: #0a0d14;
  --surface: #12161f;
  --surface-2: #171c27;
  --surface-3: #1e2430;
  --border: #262c3a;
  --border-soft: #1b2130;
  --text: #e7eaf0;
  --muted: #8891a3;
  --faint: #565e70;
  --accent: #6d5ef0;
  --accent-soft: rgba(109, 94, 240, 0.14);
  --success: #35d0a0;
  --success-soft: rgba(53, 208, 160, 0.14);
  --warning: #f5a623;
  color-scheme: dark;
  --overlay: rgba(6, 7, 11, 0.72); --scroll: #242a38; --scroll-hover: #303748;
  --shadow: none;
}
* {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Cairo", sans-serif;
  min-height: 100vh;
}
.mono {
  font-family: "IBM Plex Mono", monospace;
}
::-webkit-scrollbar {
  width: 9px;
  height: 9px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--scroll);
  border-radius: 8px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--scroll-hover);
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}

.ring {
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.ring::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: conic-gradient(var(--ring-color, var(--accent)) calc(var(--pct, 0) * 1%), var(--border) 0);
  -webkit-mask: radial-gradient(
    farthest-side,
    transparent calc(100% - var(--thick, 8px)),
    #000 calc(100% - var(--thick, 8px))
  );
  mask: radial-gradient(farthest-side, transparent calc(100% - var(--thick, 8px)), #000 calc(100% - var(--thick, 8px)));
}
.sidebar-item {
  transition:
    background 0.15s ease,
    border-color 0.15s ease;
  border-right: 3px solid transparent;
}
.sidebar-item[data-active="true"] {
  background: var(--surface-3);
  border-right-color: var(--accent);
}
.sidebar-item:hover {
  background: var(--surface-2);
}
.file-row,
.folder-card {
  transition:
    background 0.12s ease,
    border-color 0.12s ease;
}
.file-row:hover {
  background: var(--surface-2);
}
.folder-card:hover {
  background: var(--surface-2);
  border-color: var(--accent) !important;
}
.check-btn {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  border: 1.8px solid var(--faint);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
  flex-shrink: 0;
  cursor: pointer;
}
.check-btn[data-done="true"] {
  background: var(--success);
  border-color: var(--success);
}
.sel-check {
  width: 20px;
  height: 20px;
  border-radius: 6px;
  border: 1.8px solid var(--faint);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
  flex-shrink: 0;
  cursor: pointer;
  background: var(--surface);
}
.sel-check[data-checked="true"] {
  background: var(--accent);
  border-color: var(--accent);
}
.badge {
  font-size: 11.5px;
  padding: 3px 9px;
  border-radius: 20px;
  font-weight: 600;
  white-space: nowrap;
}
.modal-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  animation: fadeIn 0.15s ease;
  padding: 16px;
}
@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
.modal-card {
  animation: slideUp 0.18s ease;
}
@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.field-input {
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  color: var(--text);
  font-family: "Cairo", sans-serif;
  width: 100%;
  font-size: 14px;
}
.field-input:focus {
  border-color: var(--accent);
}
.field-input::placeholder {
  color: var(--faint);
}
textarea.field-input {
  resize: vertical;
  min-height: 60px;
  font-size: 13px;
}
.swatch {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform 0.12s ease;
}
.swatch[data-selected="true"] {
  transform: scale(1.18);
  border-color: #fff;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
  border-radius: 10px;
  font-weight: 700;
  padding: 10px 18px;
  transition: filter 0.15s ease;
  font-size: 14px;
  border: none;
  cursor: pointer;
}
.btn-primary:hover {
  filter: brightness(1.1);
}
.btn-ghost {
  background: var(--surface-3);
  color: var(--muted);
  border-radius: 10px;
  font-weight: 600;
  padding: 10px 18px;
  transition: background 0.15s ease;
  font-size: 14px;
  border: none;
  cursor: pointer;
}
.btn-ghost:hover {
  background: var(--border);
  color: var(--text);
}
.cat-pill {
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid var(--border);
  transition: all 0.12s ease;
  text-align: center;
}
.cat-pill[data-selected="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: #fff;
}
.hover-actions {
  opacity: 0;
  transition: opacity 0.12s ease;
}
.file-row:hover .hover-actions {
  opacity: 1;
}
.folder-card:hover .hover-actions {
  opacity: 1;
}
.mini-bar {
  height: 6px;
  border-radius: 4px;
  background: var(--border-soft);
  overflow: hidden;
}
.mini-bar > div {
  height: 100%;
  border-radius: 4px;
}
.dash-card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 16px;
}
.tab-btn {
  padding: 9px 18px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 13.5px;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  gap: 7px;
}
.tab-btn[data-active="true"] {
  background: var(--accent);
  color: #fff;
}
.tab-btn[data-active="false"] {
  background: none;
  color: var(--muted);
}
.tab-btn[data-active="false"]:hover {
  background: var(--surface-3);
  color: var(--text);
}
.note-box {
  background: var(--surface-3);
  border: 1px dashed var(--border);
  border-radius: 9px;
  padding: 8px 10px;
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 7px;
  cursor: text;
  white-space: pre-wrap;
}
.rich-note-display {
  background: var(--surface-3);
  border: 1px solid var(--border-soft);
  border-radius: 11px;
  padding: 12px 14px;
  margin-top: 8px;
  font-size: 13px;
  line-height: 1.7;
  color: var(--text);
  position: relative;
}
.rich-note-display.collapsed {
  max-height: 96px;
  overflow: hidden;
}
.rich-note-display.collapsed::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 36px;
  background: linear-gradient(to top, var(--surface-3), transparent);
  border-radius: 0 0 11px 11px;
  pointer-events: none;
}
.note-toggle-btn {
  display: none;
  align-items: center;
  gap: 4px;
  color: var(--accent);
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 6px;
}
.rich-note-display img {
  max-width: 100%;
  border-radius: 8px;
  margin: 6px 0;
  display: block;
}
.rich-note-display ul {
  padding-inline-start: 22px;
  margin: 6px 0;
  list-style: disc;
}
.rich-note-display ol {
  padding-inline-start: 22px;
  margin: 6px 0;
  list-style: decimal;
}
.rich-note-display b,
.rich-note-display strong {
  color: #fff;
}
.rich-note-display p {
  margin: 0 0 6px;
}
.rich-note-display p:last-child {
  margin-bottom: 0;
}
.note-toolbar {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
  margin-bottom: 8px;
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 5px;
}
.note-tool-btn {
  background: none;
  border: none;
  color: var(--muted);
  width: 30px;
  height: 30px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}
.note-tool-btn:hover {
  background: var(--border);
  color: var(--text);
}

.note-tool-btn[data-active="true"] {
  background: var(--accent-soft);
  color: var(--accent);
}

.note-editor {
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  min-height: 160px;
  max-height: 340px;
  overflow-y: auto;
  font-size: 13.5px;
  line-height: 1.7;
}
.note-editor:focus {
  outline: none;
  border-color: var(--accent);
}
.note-editor img {
  max-width: 100%;
  border-radius: 8px;
  margin: 6px 0;
  display: block;
}
.note-editor ul {
  padding-inline-start: 22px;
  margin: 6px 0;
  list-style: disc;
}
.note-editor ol {
  padding-inline-start: 22px;
  margin: 6px 0;
  list-style: decimal;
}
.note-editor:empty:before {
  content: attr(data-placeholder);
  color: var(--faint);
}
.note-frac {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  vertical-align: middle;
  direction: ltr;
  margin: 0 3px;
  font-size: 0.92em;
  line-height: 1.25;
}
.note-frac-num,
.note-frac-den {
  padding: 0 4px;
  min-width: 8px;
  text-align: center;
}
.note-frac-num {
  border-bottom: 1.6px solid currentColor;
}
.note-editor sub,
.note-editor sup,
.rich-note-display sub,
.rich-note-display sup {
  direction: ltr;
  unicode-bidi: isolate;
}
.note-symbols-row {
  display: none;
  flex-wrap: wrap;
  gap: 4px;
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 7px;
  margin-bottom: 8px;
}
.note-symbols-row[data-open="true"] {
  display: flex;
}
.note-sym-btn {
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  color: var(--text);
  min-width: 28px;
  height: 26px;
  padding: 0 5px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  direction: ltr;
  font-family: "IBM Plex Mono", monospace;
}
.note-sym-btn:hover {
  background: var(--border);
  border-color: var(--accent);
}
.import-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border-radius: 9px;
}

.explorer-row {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
.explorer-sidebar {
  width: 230px;
}

@media (max-width: 720px) {
  .explorer-row {
    flex-direction: column;
  }
  .explorer-sidebar {
    width: 100%;
  }
}
.import-row:hover {
  background: var(--surface-3);
}
.crumb {
  color: var(--muted);
  cursor: pointer;
}
.crumb:hover {
  color: var(--text);
}

@keyframes flashHighlight {
  0%,
  100% {
    background: transparent;
  }
  25%,
  75% {
    background: var(--accent-soft);
  }
}
.flash-highlight {
  animation: flashHighlight 1.6s ease;
  border-radius: 11px;
}

/* ============================================================================
   Reusable pieces
   Extracted from styles that were repeated inline across main.js. Anything that
   is *computed from data* (a progress width, a per-category colour) stays inline
   in JS — only fixed presentation lives here.
   ============================================================================ */

/* --- icon sizes (lucide <i> elements) --- */
.ico-11 {
  width: 11px;
  height: 11px;
}
.ico-12 {
  width: 12px;
  height: 12px;
}
.ico-13 {
  width: 13px;
  height: 13px;
}
.ico-14 {
  width: 14px;
  height: 14px;
}
.ico-15 {
  width: 15px;
  height: 15px;
}
.ico-16 {
  width: 16px;
  height: 16px;
}

/* --- form + modal scaffolding --- */
.field-label {
  display: block;
  font-size: 12.5px;
  color: var(--muted);
  margin-bottom: 6px;
}
.field-label-lg {
  margin-bottom: 8px;
}
.field-hint {
  font-size: 11px;
  color: var(--faint);
}
.color-input {
  width: 44px;
  height: 40px;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 2px;
  cursor: pointer;
  background: none;
  flex-shrink: 0;
}
.modal-title {
  font-weight: 800;
  font-size: 16px;
  margin-bottom: 16px;
}
.modal-title-tight {
  margin-bottom: 4px;
}
.modal-subtitle {
  color: var(--muted);
  font-size: 12.5px;
  margin-bottom: 16px;
  min-height: 14px;
}
.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}
.pill-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

/* --- small buttons / icon buttons --- */
.btn-sm {
  padding: 7px 12px;
  font-size: 12.5px;
}
.btn-xs {
  padding: 6px 12px;
  font-size: 12px;
}
.icon-btn {
  background: none;
  border: none;
  color: var(--faint);
  cursor: pointer;
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border-radius: 6px;
}
.icon-btn:hover {
  color: var(--text);
  background: var(--surface-3);
}
.icon-btn.danger:hover {
  color: #f2795b;
}

/* --- layout helpers --- */
.row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.row-8 {
  display: flex;
  align-items: center;
  gap: 8px;
}
.row-between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.grow {
  flex: 1;
  min-width: 0;
}
.nowrap {
  white-space: nowrap;
  flex-shrink: 0;
}
.truncate {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* --- text scales --- */
.t-muted {
  color: var(--muted);
  font-size: 12.5px;
}
.t-muted-sm {
  color: var(--muted);
  font-size: 12px;
}
.t-faint-sm {
  color: var(--faint);
  font-size: 11.5px;
}
.section-label {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--muted);
}

/* --- empty states --- */
.empty-state {
  text-align: center;
  color: var(--faint);
  border: 1.5px dashed var(--border);
  border-radius: 12px;
  padding: 40px 20px;
  font-size: 13.5px;
}
.empty-state.compact {
  padding: 16px;
  font-size: 12.5px;
  border-radius: 10px;
}

/* --- settings-style list row (categories / types management) --- */
.manage-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border: 1px solid var(--border-soft);
  border-radius: 10px;
}
.color-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  flex-shrink: 0;
}
.manage-row-name {
  width: 110px;
  flex-shrink: 0;
  font-size: 13.5px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Touch devices have no hover, so actions that only appear on :hover would be
   unreachable — keep them permanently visible there instead. */
@media (hover: none) {
  .hover-actions {
    opacity: 1;
  }
}

.grade-bd-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* --- drag-and-drop reordering handle (files & folders in the explorer) --- */
.drag-handle {
  color: var(--faint);
  cursor: grab;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: 4px;
  border-radius: 6px;
}
.drag-handle:hover {
  color: var(--text);
  background: var(--surface-3);
}
.drag-handle:active {
  cursor: grabbing;
}
.drag-over {
  border-color: var(--accent) !important;
  background: var(--accent-soft);
}

/* --- duration picker (hours / minutes lists, used in the file modal for clock-enabled categories) --- */
.dur-picker {
  display: flex;
  align-items: stretch;
  justify-content: center;
  gap: 10px;
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px;
}
.dur-col {
  flex: 1;
  min-width: 0;
}
.dur-col-label {
  text-align: center;
  font-size: 11.5px;
  color: var(--faint);
  font-weight: 600;
  margin-bottom: 6px;
}
.dur-list {
  position: relative; /* makes the list the offsetParent, so scrolling the selected option into view measures from the list itself */
  height: 132px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 2px;
}
.dur-sep {
  align-self: center;
  font-family: "IBM Plex Mono", monospace;
  font-weight: 600;
  color: var(--faint);
  padding-top: 18px;
}
.dur-opt {
  flex-shrink: 0;
  text-align: center;
  padding: 7px 0;
  border-radius: 9px;
  border: 1.5px solid transparent;
  font-family: "IBM Plex Mono", monospace;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.12s ease;
}
.dur-opt:hover {
  background: var(--surface-2);
  color: var(--text);
}
.dur-opt[data-selected="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: #fff;
}

/* ---- theme layer ---- */
.dash-card, .modal-card { box-shadow: var(--shadow); }
body, .dash-card, .modal-card, .tab-btn, .file-row, .folder-card { transition: background-color .25s ease, color .25s ease, border-color .25s ease; }
.theme-toggle:hover { color: var(--accent) !important; }
.sm-toast { position: fixed; inset-inline: 0; bottom: 20px; margin: 0 auto; width: fit-content; max-width: 92vw; z-index: 9999;

// isTest replaces the old separate trackMistakes/trackGrades flags — a category marked as
// "اختبار" automatically gets both grade + mistake tracking together in "قسم الاختبارات".
// Falls back to the old flags for accounts saved before this change.
function categoryIsTest(cat) {
  if (!cat) return false;
  if (cat.isTest !== undefined) return !!cat.isTest;
  return !!(cat.trackMistakes || cat.trackGrades);
}
function isTestFile(f) {

/* ---------------- durations ("ساعة" on a category) ----------------
   A category can be flagged hasDuration (clock pill in إدارة التصنيفات). Files in such a category
   get a duration, stored as file.durationMin (whole minutes; 0 / missing = not set). */
function categoryHasDuration(cat) {
  return !!(cat && cat.hasDuration);
}
// minutes a file contributes to time totals: its own duration, but only while its category still has the clock on
function fileDurationMin(f) {
  if (!f || !(f.durationMin > 0)) return 0;
  const cat = state.categories.find((c) => c.name === f.category);
  return categoryHasDuration(cat) ? f.durationMin : 0;
}
// short form for chips: "1س 30د" / "45د" / "2س"
function formatDurationShort(min) {
  const h = Math.floor(min / 60);
  const m = min % 60;
  return [h ? `${h}س` : "", m ? `${m}د` : ""].filter(Boolean).join(" ");
}
// long Arabic form for the copied message: "ساعة ونصف" style is avoided on purpose — exact numbers read better
function arPlural(n, one, two, few, many) {
  if (n === 1) return one;
  if (n === 2) return two;
  return n >= 3 && n <= 10 ? `${n} ${few}` : `${n} ${many}`;
}
function formatDurationLong(min) {
  const h = Math.floor(min / 60);
  const m = min % 60;
  const parts = [];
  if (h) parts.push(arPlural(h, "ساعة", "ساعتين", "ساعات", "ساعة"));
  if (m) parts.push(arPlural(m, "دقيقة", "دقيقتين", "دقائق", "دقيقة"));
  return parts.join(" و");
}

/* ---------------- cloud storage (Firestore — synced to the user's account) ---------------- */
async function loadDataForUser(uid) {
  state.loaded = false;
  state.loadFailed = false;
  render();
  try {
    const docRef = db.collection("users").doc(uid);
    const snap = await docRef.get();
    if (snap.exists) {
      const data = snap.data() || {};
      state.subjects = data.subjects || [];
      state.tasks = data.tasks || [];
      state.history = data.history || [];
      state.platforms = data.platforms || [];
      state.categories =
        data.categories && data.categories.length ? data.categories : DEFAULT_CATEGORIES.map((c) => ({ ...c }));
      state.mistakeTypes =
        data.mistakeTypes && data.mistakeTypes.length
          ? data.mistakeTypes
          : DEFAULT_MISTAKE_TYPES.map((t) => ({ ...t }));
      state.mistakes = data.mistakes || [];
      state.grades = data.grades || [];
    } else {
      const seed = seedData();
      state.subjects = seed.subjects;
      state.tasks = seed.tasks;
      state.history = seed.history || [];
      state.platforms = seed.platforms || [];
      state.categories = seed.categories;
      state.mistakeTypes = seed.mistakeTypes;
      state.mistakes = seed.mistakes;
      state.grades = seed.grades;
      await docRef.set({
        subjects: state.subjects,
        tasks: state.tasks,
        history: state.history,
        platforms: state.platforms,
        categories: state.categories,
        mistakeTypes: state.mistakeTypes,
        mistakes: state.mistakes,
        grades: state.grades,
      });
    }
  } catch (e) {
    console.error("load failed", e);
    state.loadFailed = true; // blocks saveData() so an empty fallback state can never overwrite the cloud copy
    state.subjects = [];
    state.tasks = [];
    state.history = [];
    state.platforms = [];
    state.categories = DEFAULT_CATEGORIES.map((c) => ({ ...c }));
    state.mistakeTypes = DEFAULT_MISTAKE_TYPES.map((t) => ({ ...t }));
    state.mistakes = [];
    state.grades = [];
  }
  state.selectedSubjectId = state.subjects[0] ? state.subjects[0].id : null;
  state.folderPath = [];
  state.loaded = true;
  render();
}
function retryLoad() {
  if (state.user) loadDataForUser(state.user.uid);

function showToast(msg) {

let pendingSave = null;
function flushSave() {
  if (!pendingSave) return;
  const { uid, snapshot } = pendingSave;
  pendingSave = null;
  clearTimeout(saveTimer);
  db.collection("users").doc(uid).set(snapshot).catch((e) => {

    showToast("تعذّر حفظ التغييرات على السحابة. تأكد من الاتصال — سيُعاد الحفظ مع التغيير التالي.");

}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushSave(); });

function saveData() {

    subjects: state.subjects,
    tasks: state.tasks,

/* ---------------- lookups (recursive — folders can be nested) ---------------- */
function getSubject(id) {
  return state.subjects.find((s) => s.id === id);
}
function findFolderRec(folders, id) {
  for (const f of folders || []) {
    if (f.id === id) return f;
    const found = findFolderRec(f.folders, id);
    if (found) return found;
  }
  return null;
}
function getFolder(subj, id) {
  return subj ? findFolderRec(subj.folders, id) : null;
}
function getFile(folder, id) {
  return folder ? folder.files.find((f) => f.id === id) : null;
}
function resolveTask(t) {
  const subj = getSubject(t.subjectId);
  const folder = getFolder(subj, t.folderId);
  const file = getFile(folder, t.fileId);
  return { subj, folder, file };
}
// container = the object (subject or folder) whose .folders array directly holds folderId
function findFolderContainer(subj, folderId) {
  function search(container) {
    for (const f of container.folders || []) {
      if (f.id === folderId) return container;
      const res = search(f);
      if (res) return res;
    }
    return null;
  }
  return subj ? search(subj) : null;
}

function findFolderPathIds(folders, targetId, trail) {
  for (const f of folders || []) {
    const newTrail = trail.concat(f.id);
    if (f.id === targetId) return newTrail;
    const res = findFolderPathIds(f.folders, targetId, newTrail);
    if (res) return res;
  }
  return null;
}

/* ---------------- drag-and-drop reordering (same-container only — not a move) ----------------
   Reorders siblings within the exact same parent: files within one folder, or folders within
   one parent (another folder, or a subject's root). Moving an item to a *different* folder/subject
   is a separate, deliberate action — the existing "move" button/modal — so a drop is only honoured
   when subjectId+parentId match the dragged item's own; otherwise it's silently ignored. */
let dragState = null; // {type:'file'|'folder', subjectId, parentId, id} — parentId: containing folder id for files; parent folder id, or null for the subject root, for folders
function onRowDragStart(e, type, subjectId, parentId, id) {
  dragState = { type, subjectId, parentId, id };
  e.dataTransfer.effectAllowed = "move";
  try {
    e.dataTransfer.setData("text/plain", id); // Firefox refuses to start a drag without this
  } catch (err) {}
}
function onRowDragOver(e, type, subjectId, parentId, targetId) {
  const d = dragState;
  if (!d || d.type !== type || d.subjectId !== subjectId || d.parentId !== parentId || d.id === targetId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  e.currentTarget.classList.add("drag-over");
}
function onRowDragLeave(e) {
  e.currentTarget.classList.remove("drag-over");
}
function onRowDragEnd() {
  dragState = null;
  document.querySelectorAll(".drag-over").forEach((el) => el.classList.remove("drag-over"));
}
function onRowDrop(e, type, subjectId, parentId, targetId) {
  e.preventDefault();
  e.currentTarget.classList.remove("drag-over");
  const d = dragState;
  dragState = null;
  if (!d || d.type !== type || d.subjectId !== subjectId || d.parentId !== parentId || d.id === targetId) return;
  const subj = getSubject(subjectId);
  const container = type === "folder" ? (parentId ? getFolder(subj, parentId) : subj) : getFolder(subj, parentId);
  const arr = container && (type === "folder" ? container.folders : container.files);
  if (!arr) return;
  const from = arr.findIndex((x) => x.id === d.id);
  const to = arr.findIndex((x) => x.id === targetId);
  if (from === -1 || to === -1) return;
  const [item] = arr.splice(from, 1);
  arr.splice(to, 0, item);
  saveData();
  render();
}
function goToFileInExplorer(subjectId, folderId, fileId) {
  const subj = getSubject(subjectId);
  if (!subj) return;
  state.selectedSubjectId = subjectId;
  state.folderPath = findFolderPathIds(subj.folders, folderId, []) || [];
  state.view = "explorer";
  render();
  setTimeout(() => {
    const el = document.getElementById("file-row-" + fileId);
    if (el) {
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.classList.add("flash-highlight");
      setTimeout(() => el.classList.remove("flash-highlight"), 1600);
    }
  }, 60);
}

function getPathTrail(subj, path) {
  let trail = [],
    folders = subj ? subj.folders : [];
  for (const id of path) {
    const f = (folders || []).find((x) => x.id === id);
    if (!f) break;
    trail.push(f);
    folders = f.folders;
  }
  return trail;
}

/* ---------------- stats (recursive across nested folders) ---------------- */
function collectFiles(folder) {
  let files = folder.files ? [...folder.files] : [];
  (folder.folders || []).forEach((sf) => (files = files.concat(collectFiles(sf))));
  return files;
}
function subjectAllFiles(subj) {
  let files = [];
  (subj.folders || []).forEach((f) => (files = files.concat(collectFiles(f))));
  return files;
}
function collectFilesWithFolder(folder) {
  let items = (folder.files || []).map((f) => ({ folder, file: f }));
  (folder.folders || []).forEach((sf) => {
    items = items.concat(collectFilesWithFolder(sf));
  });
  return items;
}
function subjectAllFilesWithFolder(subj) {
  let items = [];
  (subj.folders || []).forEach((f) => {
    items = items.concat(collectFilesWithFolder(f));
  });
  return items;
}
function getDueReviews() {
  const due = [];
  const now = new Date();
  const todayOnly = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  state.subjects.forEach((subj) => {
    subjectAllFilesWithFolder(subj).forEach(({ folder, file: f }) => {
      if (!f.done || !f.completedAt) return;
      const stage = f.reviewStage || 0;
      if (stage >= REVIEW_INTERVALS_DAYS.length) return;
      const dueDate = new Date(new Date(f.completedAt).getTime() + REVIEW_INTERVALS_DAYS[stage] * 86400000);
      const dueDateOnly = new Date(dueDate.getFullYear(), dueDate.getMonth(), dueDate.getDate());
      if (dueDateOnly <= todayOnly) due.push({ subj, folder, file: f, stage });
    });
  });
  return due;
}
function markReviewDone(subjectId, folderId, fileId) {
  const subj = getSubject(subjectId);
  const folder = getFolder(subj, folderId);
  const f = getFile(folder, fileId);
  if (!f) return;
  f.reviewStage = (f.reviewStage || 0) + 1;
  saveData();
  render();
}
function reviewNoticeStorageKey() {
  return `study-review-notice-dismissed-${state.user ? state.user.uid : "anon"}-${todayStr()}`;
}
function isReviewNoticeDismissed() {
  try {
    return localStorage.getItem(reviewNoticeStorageKey()) === "1";
  } catch (e) {
    return false;
  }
}
function dismissReviewNotice() {
  try {
    localStorage.setItem(reviewNoticeStorageKey(), "1");
  } catch (e) {}
  render();
}
function subjectStats(subj) {
  const excludedCategoryNames = new Set(state.categories.filter((c) => c.countsInOverall === false).map((c) => c.name));
  const files = subjectAllFiles(subj).filter((f) => !(f.category && excludedCategoryNames.has(f.category)));
  const total = files.length,
    done = files.filter((f) => f.done).length;
  return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
}
function taskStats() {
  let total = 0,
    done = 0;
  state.tasks.forEach((t) => {
    const { file } = resolveTask(t);
    if (file) {
      total++;
      if (file.done) done++;
    }
  });
  return { total, done, remaining: total - done, pct: total ? Math.round((done / total) * 100) : 0 };
}

/* ---------------- "الناقص عليك" — everything not done yet, read-only view over the real library ---------------- */
// Unlike state.tasks (files the student has manually chosen to work on), this needs no picking:
// it's derived straight from the subject/folder tree, same exclusion rule as overallStats().
function missingFilesBySubject() {
  const excludedNames = new Set(state.categories.filter((c) => c.countsInOverall === false).map((c) => c.name));
  const taskKey = (subjectId, folderId, fileId) => `${subjectId}|${folderId}|${fileId}`;
  const taskKeys = new Set(state.tasks.map((t) => taskKey(t.subjectId, t.folderId, t.fileId)));
  return state.subjects
    .map((subj) => {
      const items = subjectAllFilesWithFolder(subj)
        .filter(({ file }) => !file.done && !(file.category && excludedNames.has(file.category)))
        .map(({ folder, file }) => ({ folder, file, inTasks: taskKeys.has(taskKey(subj.id, folder.id, file.id)) }));
      return { subject: subj, items };
    })
    .filter((g) => g.items.length > 0);
}

// Plain-text message for sharing outside the app (WhatsApp/notes/etc.) — same grouping as the
// screen: subject (root folder) -> missing file titles, nothing else (no IDs, no links/notes).
function subjectMissingMinutes(g) {
  return g.items.reduce((n, it) => n + fileDurationMin(it.file), 0);
}
function missingTotalMinutes(groups) {
  return groups.reduce((n, g) => n + subjectMissingMinutes(g), 0);
}
function buildMissingReportText() {
  const groups = missingFilesBySubject();
  if (!groups.length) return "مفيش حاجة ناقصة عليك دلوقتي 🎉";
  const lines = ["الناقص عليّ:"];
  groups.forEach((g) => {
    const subjMin = subjectMissingMinutes(g);
    lines.push("", `${g.subject.name} (${g.items.length})${subjMin ? ` — ${formatDurationLong(subjMin)}` : ""}:`);
    g.items.forEach((it) => {
      const m = fileDurationMin(it.file);
      lines.push(`- ${it.file.title}${m ? ` — ${formatDurationLong(m)}` : ""}`);
    });
  });
  const totalMin = missingTotalMinutes(groups);
  if (totalMin) {
    lines.push("", `إجمالي الوقت المتوقع: ${formatDurationLong(totalMin)} (للمهام اللي ليها مدة بس)`);
  }
  return lines.join("\n");
}
async function copyMissingReport() {
  const text = buildMissingReportText();
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    // clipboard API can be blocked (insecure context / permissions) — fall back to a hidden textarea
    try {
      const tmp = document.createElement("textarea");
      tmp.value = text;
      tmp.style.position = "fixed";
      tmp.style.opacity = "0";
      document.body.appendChild(tmp);
      tmp.select();
      ok = document.execCommand("copy");
      document.body.removeChild(tmp);
    } catch (e2) {
      ok = false;
    }
  }
  const label = document.getElementById("missing-copy-label");
  if (!label) return;
  label.textContent = ok ? "اتنسخ ✓" : "معرفتش أنسخ";
  setTimeout(() => {
    const l = document.getElementById("missing-copy-label");
    if (l) l.textContent = "نسخ كرسالة";
  }, 2000);
}

function overallStats() {
  let allFiles = [];
  state.subjects.forEach((s) => {
    allFiles = allFiles.concat(subjectAllFiles(s));
  });
  const excludedCategoryNames = new Set(state.categories.filter((c) => c.countsInOverall === false).map((c) => c.name));
  const countedFiles = allFiles.filter((f) => !(f.category && excludedCategoryNames.has(f.category)));
  const total = countedFiles.length;
  const done = countedFiles.filter((f) => f.done).length;
  const byCategory = {};
  countedFiles.forEach((f) => {
    const cat = f.category || "بدون تصنيف";
    if (!byCategory[cat]) byCategory[cat] = { total: 0, done: 0 };
    byCategory[cat].total++;
    if (f.done) byCategory[cat].done++;
  });
  const orderedNames = state.categories.map((c) => c.name).filter((n) => byCategory[n]);
  const leftoverNames = Object.keys(byCategory).filter((n) => !orderedNames.includes(n));
  const categories = [...orderedNames, ...leftoverNames].map((name) => {
    const { total: catTotal, done: catDone } = byCategory[name];
    return { name, total: catTotal, done: catDone, pct: catTotal ? Math.round((catDone / catTotal) * 100) : 0 };
  });
  return {
    total,
    done,
    remaining: total - done,
    pct: total ? Math.round((done / total) * 100) : 0,
    categories,
    excludedCategoryCount: excludedCategoryNames.size,
  };
}
function excludedCategoriesLabel(n) {
  if (n === 1) return "فيه قسم واحد مستبعد من حساب التقدم الكلي";
  if (n === 2) return "فيه قسمين مستبعدين من حساب التقدم الكلي";
  return `فيه ${n} أقسام مستبعدة من حساب التقدم الكلي`;
}

/* ---------------- move (drag-free "file explorer" relocate: files & folders can be
         moved to any folder / subject. Review progress (done/completedAt/reviewStage) lives
         on the file object itself and getDueReviews() walks the live tree each render, so a
         moved file's due-review always resolves to its new, correct location automatically.
         Imported tasks store their own subjectId/folderId snapshot though, so those are
         re-pointed here to keep "المهام" pointing at the right place after a move. ---------------- */
function collectDescendantFolderIds(folder) {
  let ids = [folder.id];
  (folder.folders || []).forEach((sf) => {
    ids = ids.concat(collectDescendantFolderIds(sf));
  });
  return ids;
}
// Silent core movers — no saveData/closeModal/render/navigation, just the data change.
// Return true on success (including a harmless no-op move to the same place), false when skipped (invalid target).
function moveFileToLocation(subjectId, folderId, fileId, targetSubjectId, targetFolderId) {
  const subj = getSubject(subjectId);
  const folder = getFolder(subj, folderId);
  const file = getFile(folder, fileId);
  const targetSubj = getSubject(targetSubjectId);
  const targetFolder = targetSubj ? getFolder(targetSubj, targetFolderId) : null;
  if (!file || !targetFolder) return false;
  if (targetFolder === folder) return true;
  folder.files = folder.files.filter((f) => f.id !== fileId);
  if (!targetFolder.files) targetFolder.files = [];
  targetFolder.files.push(file);
  state.tasks.forEach((t) => {
    if (t.subjectId === subjectId && t.folderId === folderId && t.fileId === fileId) {
      t.subjectId = targetSubjectId;
      t.folderId = targetFolderId;
    }
  });
  return true;
}
function moveFolderToLocation(subjectId, folderId, targetSubjectId, targetParentFolderId) {
  const subj = getSubject(subjectId);
  const folder = getFolder(subj, folderId);
  if (!folder) return false;
  const excluded = collectDescendantFolderIds(folder);
  if (targetParentFolderId && excluded.includes(targetParentFolderId)) return false;
  const container = findFolderContainer(subj, folderId);
  if (!container) return false;
  const targetSubj = getSubject(targetSubjectId);
  if (!targetSubj) return false;
  const targetContainer = targetParentFolderId ? getFolder(targetSubj, targetParentFolderId) : targetSubj;
  if (!targetContainer) return false;
  if (targetContainer === container) return true;
  container.folders = container.folders.filter((f) => f.id !== folderId);
  if (!targetContainer.folders) targetContainer.folders = [];
  targetContainer.folders.push(folder);
  if (targetSubjectId !== subjectId) {
    const fileIds = new Set(collectFiles(folder).map((f) => f.id));
    state.tasks.forEach((t) => {
      if (t.subjectId === subjectId && fileIds.has(t.fileId)) t.subjectId = targetSubjectId;
    });
  }
  return true;
}
// Wrappers used by the per-row move buttons (single item, via the move-file/move-folder modal).
function moveFile(subjectId, folderId, fileId, targetSubjectId, targetFolderId) {
  const ok = moveFileToLocation(subjectId, folderId, fileId, targetSubjectId, targetFolderId);
  if (!ok) {
    closeModal();
    return;
  }
  const targetSubj = getSubject(targetSubjectId);
  state.selectedSubjectId = targetSubjectId;
  state.folderPath = findFolderPathIds(targetSubj.folders, targetFolderId, []) || [];
  saveData();
  closeModal();
  render();
}
function moveFolder(subjectId, folderId, targetSubjectId, targetParentFolderId) {
  const ok = moveFolderToLocation(subjectId, folderId, targetSubjectId, targetParentFolderId);
  if (!ok) {
    closeModal();
    return;
  }
  const targetSubj = getSubject(targetSubjectId);
  state.selectedSubjectId = targetSubjectId;
  state.folderPath = findFolderPathIds(targetSubj.folders, folderId, []) || [];
  saveData();
  closeModal();
  render();
}
// Batch mover for multi-select "نقل المحدد" (move-multi modal).
function moveSelectedTo(targetSubjectId, targetFolderId) {
  const items = state.selectedItems || [];
  let successCount = 0,
    skipCount = 0;
  items.forEach((it) => {
    const ok =
      it.type === "file"
        ? moveFileToLocation(it.subjectId, it.folderId, it.fileId, targetSubjectId, targetFolderId)
        : moveFolderToLocation(it.subjectId, it.folderId, targetSubjectId, targetFolderId);
    ok ? successCount++ : skipCount++;
  });
  saveData();
  state.selectedItems = [];
  state.selectionMode = false;
  const targetSubj = getSubject(targetSubjectId);
  state.selectedSubjectId = targetSubjectId;
  state.folderPath = targetFolderId ? findFolderPathIds(targetSubj.folders, targetFolderId, []) || [] : [];
  closeModal();
  render();
  if (skipCount > 0) {
    setTimeout(
      () => alert(`اتنقل ${successCount} عنصر. ${skipCount} اتجاهلوا (مينفعش تنقل فولدر جوه نفسه أو جوه فرع منه).`),
      50,
    );
  }
}

  if (fileId) {
    const f = getFile(folder, fileId);
    Object.assign(f, data);
  } else {
    folder.files.push({ id: uid(), done: false, note: "", ...data });
  }
  saveData();
  closeModal();
}

  const subj = getSubject(subjectId);

  if (f.done) {
    recordHistory(subj, folder, f);
    f.completedAt = new Date().toISOString();
    f.reviewStage = 0;
  } else {
    unrecordHistoryToday(f.id);
    f.completedAt = null;
    f.reviewStage = 0;

  render();
}

/* ---------------- rich notes (formatted text + images, per file) ---------------- */
function stripHtml(html) {
  const div = document.createElement("div");
  div.innerHTML = html || "";
  return (div.textContent || div.innerText || "").trim();
}
function hasNoteContent(f) {
  if (f.noteHtml) return !!stripHtml(f.noteHtml);
  return !!(f.note && f.note.trim());
}
function sanitizeNoteHTML(html) {
  const div = document.createElement("div");
  div.innerHTML = html || "";
  div.querySelectorAll("script, style, iframe, object, embed").forEach((el) => el.remove());
  div.querySelectorAll("*").forEach((el) => {
    [...el.attributes].forEach((attr) => {
      const name = attr.name.toLowerCase();
      const val = (attr.value || "").trim().toLowerCase();
      if (name.startsWith("on")) el.removeAttribute(attr.name);
      if ((name === "href" || name === "src") && val.startsWith("javascript:")) el.removeAttribute(attr.name);
    });
  });
  return div.innerHTML;
}
function saveNoteRich(subjectId, folderId, fileId, html) {
  const subj = getSubject(subjectId);
  const folder = getFolder(subj, folderId);
  const f = getFile(folder, fileId);
  if (!f) return;
  const clean = sanitizeNoteHTML(html);
  f.noteHtml = clean;
  f.note = stripHtml(clean);
  saveData();
}
function compressImageFile(file, maxWidth = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width,
          h = img.height;
        if (w > maxWidth) {
          h = Math.round(h * (maxWidth / w));
          w = maxWidth;
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
let noteSavedRange = null;
function saveNoteSelection() {
  const sel = window.getSelection();
  const editor = document.getElementById("note-editor");
  if (sel && sel.rangeCount > 0 && editor && editor.contains(sel.getRangeAt(0).commonAncestorContainer)) {
    noteSavedRange = sel.getRangeAt(0).cloneRange();
  }
}
function restoreNoteSelection() {
  const editor = document.getElementById("note-editor");
  if (!editor) return;
  editor.focus();
  const sel = window.getSelection();
  sel.removeAllRanges();
  if (noteSavedRange) {
    sel.addRange(noteSavedRange);
  } else {
    const range = document.createRange();
    range.selectNodeContents(editor);
    range.collapse(false);
    sel.addRange(range);
  }
}
function insertImageIntoNote(dataUrl) {
  restoreNoteSelection();
  const sel = window.getSelection();
  if (sel.rangeCount === 0) return;
  const range = sel.getRangeAt(0);
  range.deleteContents();
  const img = document.createElement("img");
  img.src = dataUrl;
  range.insertNode(img);
  range.setStartAfter(img);
  range.setEndAfter(img);
  sel.removeAllRanges();
  sel.addRange(range);
  noteSavedRange = range.cloneRange();
}

async function handleNoteImageUpload(input) {
  const file = input.files && input.files[0];
  if (!file) {
    return;
  }
  if (!file.type.startsWith("image/")) {
    input.value = "";
    return;
  }
  try {
    const dataUrl = await compressImageFile(file);
    insertImageIntoNote(dataUrl);
  } catch (e) {
    console.error(e);
    alert("تعذر رفع الصورة");
  }

}
function handleNotePaste(e) {
  const items = (e.clipboardData && e.clipboardData.items) || [];
  for (const item of items) {
    if (item.kind === "file" && item.type.startsWith("image/")) {
      e.preventDefault();
      const file = item.getAsFile();
      saveNoteSelection();
      compressImageFile(file)
        .then(insertImageIntoNote)
        .catch((err) => console.error(err));
      return;
    }
  }
  const html = e.clipboardData && e.clipboardData.getData("text/html");
  if (html && html.trim()) {
    e.preventDefault();
    const cleaned = cleanPastedHTML(html);
    const editor = document.getElementById("note-editor");
    if (editor) editor.focus();
    document.execCommand("insertHTML", false, cleaned || "");
    return;
  }
  // no rich HTML available (e.g. plain unicode text) — let the browser's
  // default plain-text paste happen, this already preserves things like
  // copied ⇌ ² ₂ Δ characters since they're just normal text.
}
// keeps a formula/fraction's structure (bold, sub/sup, tables, images,
// links, our own note-frac fraction spans) when pasted from elsewhere,
// while stripping fonts/colors/junk markup so notes stay consistent.
function cleanPastedHTML(html) {
  const allowedTags = new Set([
    "B",
    "STRONG",
    "I",
    "EM",
    "U",
    "SUB",
    "SUP",
    "BR",
    "P",
    "DIV",
    "UL",
    "OL",
    "LI",
    "SPAN",
    "IMG",
    "A",
    "TABLE",
    "TBODY",
    "TR",
    "TD",
  ]);
  const div = document.createElement("div");
  div.innerHTML = html;
  div.querySelectorAll("script, style, iframe, object, embed, meta, link, head, title").forEach((el) => el.remove());
  const cleanNode = (node) => {
    [...node.childNodes].forEach((child) => {
      if (child.nodeType === 1) {
        if (!allowedTags.has(child.tagName)) {
          while (child.firstChild) child.parentNode.insertBefore(child.firstChild, child);
          child.parentNode.removeChild(child);
          return;
        }
        const isFracPart =
          child.classList.contains("note-frac") ||
          child.classList.contains("note-frac-num") ||
          child.classList.contains("note-frac-den");
        [...child.attributes].forEach((attr) => {
          const name = attr.name.toLowerCase();
          if (name === "class" && isFracPart) return;
          if (child.tagName === "IMG" && name === "src" && !attr.value.trim().toLowerCase().startsWith("javascript:"))
            return;
          if (child.tagName === "A" && name === "href" && !attr.value.trim().toLowerCase().startsWith("javascript:"))
            return;
          child.removeAttribute(attr.name);
        });
        cleanNode(child);
      } else if (child.nodeType !== 3) {
        child.remove();
      }
    });
  };
  cleanNode(div);
  return div.innerHTML;
}

      state.history = data.history || [];
      state.platforms = data.platforms || [];
      state.categories =
        data.categories && data.categories.length ? data.categories : DEFAULT_CATEGORIES.map((c) => ({ ...c }));
      state.mistakeTypes =

// Files store their category by NAME (file.category === "واجب"), not by id, so a rename has to
// rewrite every file that referenced the old name — otherwise they all silently lose their
// category (badge disappears, isTest stops applying, grades drop out of قسم الاختبارات).
function renameCategoryOnFiles(oldName, newName) {
  if (oldName === newName) return 0;
  let touched = 0;
  state.subjects.forEach((subj) => {
    subjectAllFiles(subj).forEach((file) => {
      if (file.category === oldName) {
        file.category = newName;
        touched += 1;
      }
    });
  });
  return touched;
}

  if (!name) {

  renameCategoryOnFiles(cat.name, name);

function focusModalInput() {
  const ids = {
    subject: "subj-name-input",
    folder: "folder-name-input",
    file: "f-title",
    note: "note-editor",
    platform: "platform-name-input",
    "platform-edit": "platform-name-input",
    "category-edit": "edit-cat-name",
  };
  const id = ids[state.modal.type];
  if (!id) return;
  setTimeout(() => {
    const el = document.getElementById(id);
    if (!el) return;
    el.focus();
    if (el.select) el.select();
    else if (el.id === "note-editor") {
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }, 30);
}

function passwordChangeErrorMessage(e) {
  const code = (e && e.code) || "";
  if (code.includes("wrong-password") || code.includes("invalid-credential")) return "كلمة السر الحالية غلط";
  if (code.includes("weak-password")) return "كلمة السر الجديدة لازم تكون 6 حروف/أرقام على الأقل";
  if (code.includes("requires-recent-login")) return "لازم تسجل خروج وتدخل تاني قبل ما تقدر تغيّر كلمة السر";
  if (code.includes("network-request-failed")) return "مفيش اتصال بالإنترنت";
  return "حصل خطأ، حاول تاني";
}
async function submitPasswordChange() {
  const current = (document.getElementById("pw-current") || {}).value || "";
  const next = (document.getElementById("pw-new") || {}).value || "";
  const confirmPw = (document.getElementById("pw-confirm") || {}).value || "";
  if (!current || !next || !confirmPw) {
    state.settingsPwMsg = "من فضلك املأ كل الحقول";
    state.settingsPwMsgType = "error";
    render();
    return;
  }
  if (next.length < 6) {
    state.settingsPwMsg = "كلمة السر الجديدة لازم تكون 6 حروف/أرقام على الأقل";
    state.settingsPwMsgType = "error";
    render();
    return;
  }
  if (next !== confirmPw) {
    state.settingsPwMsg = "كلمة السر الجديدة والتأكيد مش متطابقين";
    state.settingsPwMsgType = "error";
    render();
    return;
  }
  state.settingsPwBusy = true;
  state.settingsPwMsg = "";
  render();
  try {
    const cred = firebase.auth.EmailAuthProvider.credential(state.user.email, current);
    await auth.currentUser.reauthenticateWithCredential(cred);
    await auth.currentUser.updatePassword(next);
    state.settingsPwMsg = "اتغيرت كلمة السر بنجاح";
    state.settingsPwMsgType = "success";
  } catch (e) {
    state.settingsPwMsg = passwordChangeErrorMessage(e);
    state.settingsPwMsgType = "error";
  }
  state.settingsPwBusy = false;
  render();
}

      </div>
      ${
        t.total > 0
          ? `<div style="display:flex; gap:20px; flex-wrap:wrap; margin-bottom:14px; font-size:13px;">
        <div><span class="t-muted">إجمالي</span> <span class="mono" style="font-weight:700;">${t.total}</span></div>
        <div><span class="t-muted">خلصتها</span> <span class="mono" style="font-weight:700; color:var(--success);">${t.done}</span></div>
        <div><span class="t-muted">متبقية</span> <span class="mono" style="font-weight:700; color:var(--warning);">${t.remaining}</span></div>
      </div>`
          : ""
      }

      ${
        state.tasks.length === 0
          ? `
        <div style="text-align:center; color:var(--faint); padding:50px 20px; border:1.5px dashed var(--border); border-radius:12px;">
          <div style="font-size:13.5px;">لسه ما اخترتش مهام — ضيف من "الناقص عليك" فوق، أو دوس "استيراد ملف كمهمة"</div>
        </div>
      `
          : `
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:10px;">
          <div style="display:flex; gap:6px;">
            <div class="cat-pill" data-selected="${state.taskFilter === "all"}" onclick="setTaskFilter('all')">الكل (${state.tasks.length})</div>
            <div class="cat-pill" data-selected="${state.taskFilter === "pending"}" onclick="setTaskFilter('pending')">متبقي (${state.tasks.length - doneCount})</div>
            <div class="cat-pill" data-selected="${state.taskFilter === "done"}" onclick="setTaskFilter('done')">مكتمل (${doneCount})</div>
          </div>
          ${
            doneCount > 0
              ? `<button onclick="clearCompletedTasks()" class="btn-ghost btn-sm row">
                  <i data-lucide="eraser" class="ico-13"></i> امسح المكتملة
                </button>`
              : ""
          }
        </div>
        ${
          filteredTasks.length === 0
            ? `
          <div style="text-align:center; color:var(--faint); padding:30px 20px; border:1.5px dashed var(--border); border-radius:12px;">
            <div style="font-size:13px;">مفيش مهام في الفلتر ده</div>
          </div>
        `
            : `
          <div style="display:flex; flex-direction:column; gap:6px;">
            ${filteredTasks.map(taskRow).join("")}
          </div>
        `
        }
      `
      }
    </div>
  `;
}

function taskRow(t) {
  const { subj, folder, file } = resolveTask(t);
  if (!file) return "";
  const noteExists = hasNoteContent(file);
  return `
  <div class="file-row" style="display:flex; align-items:flex-start; gap:12px; padding:11px 12px; border:1px solid var(--border-soft); border-radius:11px; ${file.done ? "opacity:0.6;" : ""}">
    <div class="check-btn" data-done="${file.done}" onclick='toggleTaskDone(${JSON.stringify(t)})' style="margin-top:1px;">
      ${file.done ? '<i data-lucide="check" style="width:14px;height:14px;color:#06110B;"></i>' : ""}
    </div>
    <div class="grow">
      <div style="font-weight:600; font-size:14px; ${file.done ? "text-decoration:line-through; text-decoration-color:var(--faint);" : ""} overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(file.title)}</div>
      <div style="display:flex; align-items:center; gap:8px; margin-top:5px; flex-wrap:wrap;">
        ${categoryBadgeHTML(file.category, subj)}
        ${durationChipHTML(file)}
        <span class="t-faint-sm">${esc(subj.name)} / ${esc(folder.name)}</span>
        ${file.link ? `<a href="${esc(file.link)}" target="_blank" rel="noopener" style="color:var(--accent); display:flex; align-items:center; gap:3px; font-size:12px; font-weight:600;"><i data-lucide="play-circle" class="ico-12"></i> ادخل الدرس</a>` : ""}
        ${file.pdfLink ? `<a href="${esc(file.pdfLink)}" target="_blank" rel="noopener" style="color:var(--muted); display:flex; align-items:center; gap:3px; font-size:12px;"><i data-lucide="file-text" class="ico-12"></i> PDF</a>` : ""}
        <span onclick="openModal({type:'note', subjectId:'${subj.id}', folderId:'${folder.id}', fileId:'${file.id}'})" style="color:${noteExists ? "var(--warning)" : "var(--faint)"}; cursor:pointer; display:flex; align-items:center; gap:3px; font-size:12px; font-weight:600;"><i data-lucide="sticky-note" class="ico-12"></i> ${noteExists ? "تعديل الملاحظة" : "إضافة ملاحظة"}</span>
      </div>
      ${
        noteExists
          ? `
      <div id="note-display-${file.id}" class="rich-note-display collapsed">${file.noteHtml || `<p>${esc(file.note)}</p>`}</div>
      <div id="note-toggle-${file.id}" class="note-toggle-btn" onclick="toggleNoteExpand('${file.id}')">
        <span class="note-toggle-label">عرض المزيد</span><i data-lucide="chevron-down" class="ico-12"></i>
      </div>`
          : ""
      }
    </div>
    <button class="hover-actions" onclick="removeTask('${t.id}')" title="إزالة من المهام" style="background:none; border:none; color:var(--faint); cursor:pointer; padding:6px; flex-shrink:0;">
      <i data-lucide="x" class="ico-15"></i>
    </button>
  </div>`;
}

/* ---------------- EXPLORER VIEW (subjects -> nested folders -> files) ---------------- */
function renderExplorer() {
  const selectedSubj = getSubject(state.selectedSubjectId);

  return `
    <div class="explorer-row">
      <div class="dash-card explorer-sidebar" style="flex-shrink:0; overflow:hidden;">
        <div style="padding:12px 14px 8px; color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.3px;">المواد</div>
        <div>
          ${state.subjects
            .map((s) => {
              const st = subjectStats(s);
              const active = s.id === state.selectedSubjectId;
              return `
            <div class="sidebar-item" data-active="${active}" style="display:flex; align-items:center; justify-content:space-between; padding:9px 14px; cursor:pointer;" onclick="selectSubject('${s.id}')">
              <div style="display:flex; align-items:center; gap:9px; min-width:0;">
                ${subjectIconHTML(s)}
                <span style="font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(s.name)}</span>
              </div>
              <span class="mono" style="font-size:11px; color:var(--faint); flex-shrink:0;">${st.pct}%</span>
            </div>`;
            })
            .join("")}
        </div>
        <div style="padding:10px 14px 14px;">
          <button onclick="openModal({type:'subject'})" style="width:100%; display:flex; align-items:center; justify-content:center; gap:6px; background:none; border:1.5px dashed var(--border); color:var(--muted); border-radius:10px; padding:9px; font-size:13px; font-weight:600; cursor:pointer;">
            <i data-lucide="plus" class="ico-15"></i> مادة جديدة
          </button>
        </div>
      </div>

      <div class="dash-card" style="flex:1; min-width:0; padding:18px;">
        ${
          !selectedSubj
            ? `
          <div style="text-align:center; color:var(--faint); padding:60px 20px;">
            <i data-lucide="folder-open" style="width:34px;height:34px; margin-bottom:10px;"></i>
            <div style="font-size:14px;">أضف مادة من القائمة الجانبية لتبدأ إضافة الفولدرات والملفات</div>
          </div>
        `
            : renderFolderLevel(selectedSubj)
        }
      </div>
    </div>
  `;
}

// Renders whatever level of the folder tree the user is currently browsing (subject root,
// or any nested folder), based on state.folderPath. Folders can contain subfolders (تفرعات)
// as well as files at the same time.
function renderFolderLevel(subj) {
  const path = state.folderPath;
  const trail = getPathTrail(subj, path);
  const folder = trail.length ? trail[trail.length - 1] : null;
  const foldersArr = folder ? folder.folders || [] : subj.folders || [];
  const directFiles = folder ? folder.files || [] : [];
  const doneCount = directFiles.filter((x) => x.done).length;
  const sStats = subjectStats(subj);

  const breadcrumbHTML = `
    <div style="display:flex; align-items:center; gap:6px; margin-bottom:14px; font-size:12.5px; flex-wrap:wrap;">
      <span class="crumb" onclick="goToDepth(-1)" style="${trail.length ? "" : "color:var(--text); font-weight:700;"}">${esc(subj.name)}</span>
      ${trail
        .map(
          (f, i) => `
        <i data-lucide="chevron-left" style="width:13px;height:13px; color:var(--faint);"></i>
        <span class="crumb" onclick="goToDepth(${i})" style="${i === trail.length - 1 ? "color:var(--text); font-weight:700;" : ""}">${esc(f.name)}</span>
      `,
        )
        .join("")}
    </div>
  `;

  const headerHTML = `
    <div class="row-between" style="margin-bottom:16px;">
      <div style="display:flex; align-items:center; gap:11px;">
        ${
          folder
            ? `
          <button onclick="goUp()" style="background:var(--surface-3); border:none; border-radius:9px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:pointer; flex-shrink:0;">
            <i data-lucide="arrow-right" class="ico-16"></i>
          </button>
        `
            : subjectIconHTML(subj, 22)
        }
        <div>
          <div style="font-weight:800; font-size:17px;">${folder ? esc(folder.name) : esc(subj.name)}</div>
          <div class="mono t-muted-sm">${
            folder
              ? `${doneCount}/${directFiles.length} ملف مباشر في الفولدر ده`
              : `${sStats.done}/${sStats.total} ملف مكتمل · ${sStats.pct}%`
          }</div>
        </div>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        ${
          state.clipboard && state.clipboard.length
            ? `
        <div style="display:flex; align-items:center; gap:2px; background:var(--accent-soft); border-radius:10px; padding-left:4px;">
          <button onclick="pasteClipboard()" style="display:flex; align-items:center; gap:6px; background:none; border:none; color:var(--accent); cursor:pointer; padding:8px 10px; font-size:13px; font-weight:600;">
            <i data-lucide="clipboard-paste" class="ico-15"></i> لصق (${state.clipboard.length})
          </button>
          <button onclick="cancelClipboard()" title="إلغاء القص" style="background:none; border:none; color:var(--accent); cursor:pointer; padding:6px;">
            <i data-lucide="x" class="ico-13"></i>
          </button>
        </div>`
            : ""
        }
        <button onclick="toggleSelectionMode()" class="btn-ghost" style="display:flex; align-items:center; gap:6px;">
          <i data-lucide="${state.selectionMode ? "x" : "check-square"}" style="width:15px;height:15px;"></i> ${state.selectionMode ? "إلغاء التحديد" : "تحديد"}
        </button>
        <button onclick='openModal({type:"folder", subjectId:"${subj.id}", parentFolderId:${folder ? `"${folder.id}"` : null}})' class="btn-primary" style="display:flex; align-items:center; gap:6px;">
          <i data-lucide="folder-plus" class="ico-15"></i> فولدر جديد
        </button>
        ${
          folder
            ? `
          <button onclick='openModal({type:"file", subjectId:"${subj.id}", folderId:"${folder.id}"})' class="btn-primary" style="display:flex; align-items:center; gap:6px;">
            <i data-lucide="plus" class="ico-15"></i> ملف جديد
          </button>
        `
            : `
          <button onclick="deleteSubject('${subj.id}')" title="حذف المادة" style="background:none; border:1px solid var(--border); border-radius:10px; padding:0 12px; color:var(--faint); cursor:pointer;">
            <i data-lucide="trash-2" class="ico-15"></i>
          </button>
        `
        }
      </div>
    </div>
  `;

  const gridHTML =
    foldersArr.length === 0
      ? `
      <div style="text-align:center; color:var(--faint); padding:${folder ? "26px" : "48px"} 20px; border:1.5px dashed var(--border); border-radius:12px; ${folder ? "margin-bottom:16px;" : ""}">
        <div style="font-size:13.5px;">لا توجد فولدرات فرعية بعد${folder ? " — تقدر تضيف فولدر جواه" : ""}</div>
      </div>
    `
      : `
      <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:12px; ${folder ? "margin-bottom:20px;" : ""}">
        ${foldersArr
          .map((f) => {
            const files = collectFiles(f);
            const done = files.filter((x) => x.done).length;
            const subCount = (f.folders || []).length;
            return `
          <div class="folder-card" style="border:1px solid var(--border-soft); border-radius:13px; padding:16px; cursor:pointer; position:relative;" onclick="${state.selectionMode ? `toggleSelectItem('folder','${subj.id}','${f.id}')` : `openFolder('${f.id}')`}" ${state.selectionMode ? "" : `ondragover="onRowDragOver(event,'folder','${subj.id}',${folder ? `'${folder.id}'` : "null"},'${f.id}')" ondragleave="onRowDragLeave(event)" ondrop="onRowDrop(event,'folder','${subj.id}',${folder ? `'${folder.id}'` : "null"},'${f.id}')"`}>
            ${
              state.selectionMode
                ? `<div class="sel-check" data-checked="${isSelected("folder", subj.id, f.id)}" style="position:absolute; top:6px; right:6px; z-index:2;">
                  ${isSelected("folder", subj.id, f.id) ? '<i data-lucide="check" style="width:12px;height:12px;color:#06110B;"></i>' : ""}
                </div>`
                : `<div class="hover-actions" style="position:absolute; top:6px; left:6px; display:flex; gap:2px;">
              <button onclick="event.stopPropagation(); openModal({type:'folder', subjectId:'${subj.id}', parentFolderId:${folder ? `'${folder.id}'` : "null"}, folderId:'${f.id}'})" title="إعادة تسمية" style="background:none; border:none; color:var(--faint); cursor:pointer; padding:4px;">
                <i data-lucide="pencil" class="ico-13"></i>
              </button>
              <button onclick="event.stopPropagation(); openModal({type:'move-folder', subjectId:'${subj.id}', folderId:'${f.id}'})" title="نقل الفولدر" style="background:none; border:none; color:var(--faint); cursor:pointer; padding:4px;">
                <i data-lucide="move" class="ico-13"></i>
              </button>
              <button onclick="event.stopPropagation(); deleteFolder('${subj.id}','${f.id}')" title="حذف الفولدر" style="background:none; border:none; color:var(--faint); cursor:pointer; padding:4px;">
                <i data-lucide="x" class="ico-13"></i>
              </button>
            </div>
            <div class="drag-handle" draggable="true" title="اسحب لإعادة الترتيب" onclick="event.stopPropagation()" ondragstart="onRowDragStart(event,'folder','${subj.id}',${folder ? `'${folder.id}'` : "null"},'${f.id}')" ondragend="onRowDragEnd(event)" style="position:absolute; bottom:8px; left:8px;">
              <i data-lucide="grip-vertical" class="ico-13"></i>
            </div>`
            }
            ${folderIconSVG(subj.color, 30)}
            <div style="font-weight:700; font-size:14px; margin-top:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(f.name)}</div>
            <div class="mono" style="font-size:11.5px; color:var(--faint); margin-top:3px;">${done}/${files.length} ملف${subCount ? " · " + subCount + " فولدر فرعي" : ""}</div>
          </div>`;
          })
          .join("")}
      </div>
    `;

  const filesHTML = !folder
    ? ""
    : directFiles.length === 0
      ? `
      <div style="text-align:center; color:var(--faint); padding:36px 20px; border:1.5px dashed var(--border); border-radius:12px;">
        <div style="font-size:13.5px;">لا توجد ملفات مباشرة في "${esc(folder.name)}" بعد</div>
      </div>
    `
      : `
      <div style="display:flex; flex-direction:column; gap:6px;">
        ${directFiles.map((f) => renderFileRow(subj, folder, f)).join("")}
      </div>
    `;

  return breadcrumbHTML + headerHTML + gridHTML + filesHTML;
}

function renderFileRow(subj, folder, f) {
  const alreadyTask = state.tasks.some((t) => t.fileId === f.id && t.folderId === folder.id && t.subjectId === subj.id);
  const noteExists = hasNoteContent(f);
  const cat = state.categories.find((c) => c.name === f.category);
  const excludedFromOverall = !!(cat && cat.countsInOverall === false);
  const grade = categoryIsTest(cat) ? gradeForFile(f.id) : null;
  const gradePct = grade ? gradeItemPct(grade) : null;
  return `
  <div id="file-row-${f.id}" class="file-row" style="display:flex; align-items:flex-start; gap:12px; padding:11px 12px; border:1px solid var(--border-soft); border-radius:11px; ${f.done ? "opacity:0.6;" : ""}" ${state.selectionMode ? "" : `ondragover="onRowDragOver(event,'file','${subj.id}','${folder.id}','${f.id}')" ondragleave="onRowDragLeave(event)" ondrop="onRowDrop(event,'file','${subj.id}','${folder.id}','${f.id}')"`}>
    ${
      state.selectionMode
        ? `<div class="sel-check" data-checked="${isSelected("file", subj.id, folder.id, f.id)}" onclick="toggleSelectItem('file','${subj.id}','${folder.id}','${f.id}')" style="margin-top:1px;">
      ${isSelected("file", subj.id, folder.id, f.id) ? '<i data-lucide="check" style="width:12px;height:12px;color:#06110B;"></i>' : ""}
    </div>`
        : ""
    }
    <div class="check-btn" data-done="${f.done}" onclick="toggleFile('${subj.id}','${folder.id}','${f.id}')" style="margin-top:1px;">
      ${f.done ? '<i data-lucide="check" style="width:14px;height:14px;color:#06110B;"></i>' : ""}
    </div>
    <div class="grow">
      <div style="display:flex; align-items:center; gap:8px;">
        <div style="font-weight:600; font-size:14px; ${f.done ? "text-decoration:line-through; text-decoration-color:var(--faint);" : ""} overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(f.title)}</div>
        ${gradePct !== null ? `<span class="mono" style="font-size:11px; font-weight:700; padding:2px 7px; border-radius:20px; flex-shrink:0; background:${gradePct >= 50 ? "var(--success-soft)" : "rgba(242,121,91,0.14)"}; color:${gradePct >= 50 ? "var(--success)" : "#F2795B"};">${gradePct}%</span>` : ""}
      </div>
      <div style="display:flex; align-items:center; gap:8px; margin-top:5px; flex-wrap:wrap;">
        ${categoryBadgeHTML(f.category, subj)}
        ${durationChipHTML(f)}
        ${excludedFromOverall ? `<span title="التصنيف ده مستبعد من حساب التقدم الكلي" style="font-size:10.5px; color:var(--faint); opacity:0.7; display:flex; align-items:center; gap:3px;"><i data-lucide="eye-off" style="width:10px;height:10px;"></i> غير محسوب في التقدم</span>` : ""}
        ${f.link ? `<a href="${esc(f.link)}" target="_blank" rel="noopener" style="color:var(--muted); display:flex; align-items:center; gap:3px; font-size:12px;"><i data-lucide="link-2" class="ico-12"></i> رابط الدرس</a>` : ""}
        ${f.pdfLink ? `<a href="${esc(f.pdfLink)}" target="_blank" rel="noopener" style="color:var(--muted); display:flex; align-items:center; gap:3px; font-size:12px;"><i data-lucide="file-text" class="ico-12"></i> PDF</a>` : ""}
        ${alreadyTask ? `<span style="font-size:11px; color:var(--success); display:flex; align-items:center; gap:3px;"><i data-lucide="check-circle" class="ico-11"></i> ضمن المهام</span>` : `<span onclick="importTask('${subj.id}','${folder.id}','${f.id}')" style="font-size:11px; color:var(--accent); cursor:pointer; font-weight:600; display:flex; align-items:center; gap:3px;"><i data-lucide="import" class="ico-11"></i> إضافة كمهمة</span>`}
        <span onclick="openModal({type:'note', subjectId:'${subj.id}', folderId:'${folder.id}', fileId:'${f.id}'})" style="color:${noteExists ? "var(--warning)" : "var(--faint)"}; cursor:pointer; display:flex; align-items:center; gap:3px; font-size:12px; font-weight:600;"><i data-lucide="sticky-note" class="ico-12"></i> ${noteExists ? "تعديل الملاحظة" : "إضافة ملاحظة"}</span>
        ${categoryIsTest(cat) ? `<span onclick="goToFileInTests('${subj.id}','${folder.id}','${f.id}')" style="color:var(--accent); cursor:pointer; display:flex; align-items:center; gap:3px; font-size:12px; font-weight:600;"><i data-lucide="graduation-cap" class="ico-12"></i> فتح في الاختبارات</span>` : ""}
      </div>
      ${
        noteExists
          ? `
      <div id="note-display-${f.id}" class="rich-note-display collapsed">${f.noteHtml || `<p>${esc(f.note)}</p>`}</div>
      <div id="note-toggle-${f.id}" class="note-toggle-btn" onclick="toggleNoteExpand('${f.id}')">
        <span class="note-toggle-label">عرض المزيد</span><i data-lucide="chevron-down" class="ico-12"></i>
      </div>`
          : ""
      }
    </div>
    <div class="hover-actions" style="display:flex; gap:4px; flex-shrink:0;">
      <button onclick='openModal({type:"file", subjectId:"${subj.id}", folderId:"${folder.id}", fileId:"${f.id}"})' title="تعديل" style="background:none; border:none; color:var(--faint); cursor:pointer; padding:6px;">
        <i data-lucide="pencil" class="ico-14"></i>
      </button>
      <button onclick="openModal({type:'move-file', subjectId:'${subj.id}', folderId:'${folder.id}', fileId:'${f.id}'})" title="نقل الملف" style="background:none; border:none; color:var(--faint); cursor:pointer; padding:6px;">
        <i data-lucide="move" class="ico-14"></i>
      </button>
      <button onclick="deleteFile('${subj.id}','${folder.id}','${f.id}')" title="حذف" style="background:none; border:none; color:var(--faint); cursor:pointer; padding:6px;">
        <i data-lucide="trash-2" class="ico-14"></i>
      </button>
    </div>
    ${
      state.selectionMode
        ? ""
        : `<div class="drag-handle" draggable="true" title="اسحب لإعادة الترتيب" onclick="event.stopPropagation()" ondragstart="onRowDragStart(event,'file','${subj.id}','${folder.id}','${f.id}')" ondragend="onRowDragEnd(event)" style="margin-top:1px;">
      <i data-lucide="grip-vertical" class="ico-14"></i>
    </div>`
    }
  </div>`;
}

/* ---------------- HISTORY VIEW (what got done, grouped by day) ---------------- */
function dateStrToDate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function dateObjToStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function historyStats() {
  const history = state.history || [];
  if (!history.length) return null;
  const dateSet = new Set(history.map((h) => h.date));
  const dates = [...dateSet].sort();
  const firstDate = dates[0];
  const today = todayStr();
  const daysSinceStart = Math.round((dateStrToDate(today) - dateStrToDate(firstDate)) / 86400000) + 1;
  const activeDays = dates.length;
  const emptyDays = Math.max(0, daysSinceStart - activeDays);
  const consistencyPct = daysSinceStart ? Math.round((activeDays / daysSinceStart) * 100) : 0;

  // longest run of back-to-back active days
  let bestStreak = 1,
    run = 1;
  for (let i = 1; i < dates.length; i++) {
    const gap = Math.round((dateStrToDate(dates[i]) - dateStrToDate(dates[i - 1])) / 86400000);
    run = gap === 1 ? run + 1 : 1;
    if (run > bestStreak) bestStreak = run;
  }
  // current run, counted backward from today (still counts if today just hasn't happened yet but yesterday did)
  let currentStreak = 0;
  let cursor = dateSet.has(today)
    ? dateStrToDate(today)
    : (() => {
        const y = dateStrToDate(today);
        y.setDate(y.getDate() - 1);
        return y;
      })();
  while (dateSet.has(dateObjToStr(cursor))) {
    currentStreak += 1;
    cursor.setDate(cursor.getDate() - 1);
  }

  return {
    firstDate,
    daysSinceStart,
    activeDays,
    emptyDays,
    consistencyPct,
    totalTasks: history.length,
    bestStreak,
    currentStreak,
  };
}

function formatDateLabel(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  let label = dt.toLocaleDateString("ar-EG", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  const today = todayStr();
  const yestD = new Date();
  yestD.setDate(yestD.getDate() - 1);
  const yest = `${yestD.getFullYear()}-${String(yestD.getMonth() + 1).padStart(2, "0")}-${String(yestD.getDate()).padStart(2, "0")}`;
  if (dateStr === today) return `اليوم — ${label}`;
  if (dateStr === yest) return `أمس — ${label}`;
  return label;
}

/* ----- duration picker: two scroll lists (hours / minutes) in the app's own pill style ----- */
let pickedDurH = 0;
let pickedDurM = 0;
function durationPickerHTML() {
  const hours = Array.from({ length: 24 }, (_, i) => i);
  const mins = Array.from({ length: 60 }, (_, i) => i);
  const opt = (kind, v, label, sel) =>
    `<div class="dur-opt" data-kind="${kind}" data-val="${v}" data-selected="${sel}" onclick="pickDuration('${kind}',${v})">${label}</div>`;
  return `
    <div class="dur-picker">
      <div class="dur-col">
        <div class="dur-col-label">ساعات</div>
        <div class="dur-list" id="dur-list-h">${hours.map((v) => opt("h", v, v, v === pickedDurH)).join("")}</div>
      </div>
      <div class="dur-sep">:</div>
      <div class="dur-col">
        <div class="dur-col-label">دقائق</div>
        <div class="dur-list" id="dur-list-m">${mins.map((v) => opt("m", v, String(v).padStart(2, "0"), v === pickedDurM)).join("")}</div>
      </div>
    </div>
    <div class="row-between" style="margin-top:8px;">
      <span id="dur-summary" class="t-muted">${durationSummaryText()}</span>
      <span class="t-faint-sm" style="cursor:pointer;" onclick="pickDuration('clear')">مسح</span>
    </div>`;
}
function durationSummaryText() {
  const total = pickedDurH * 60 + pickedDurM;
  return total ? `المدة: ${formatDurationLong(total)}` : "لسه ما اخترتش مدة";
}
function pickDuration(kind, v) {
  if (kind === "clear") {
    pickedDurH = 0;
    pickedDurM = 0;
  } else if (kind === "h") pickedDurH = v;
  else pickedDurM = v;
  document.querySelectorAll(".dur-opt").forEach((el) => {
    const k = el.getAttribute("data-kind");
    const val = Number(el.getAttribute("data-val"));
    el.setAttribute("data-selected", String(k === "h" ? val === pickedDurH : val === pickedDurM));
  });
  const s = document.getElementById("dur-summary");
  if (s) s.textContent = durationSummaryText();
  if (kind === "clear") scrollDurationSelection();
}
// bring the currently selected hour/minute into view inside each list (needs the block to be visible)
function scrollDurationSelection() {
  ["h", "m"].forEach((k) => {
    const list = document.getElementById(`dur-list-${k}`);
    const sel = list && list.querySelector('.dur-opt[data-selected="true"]');
    if (list && sel) list.scrollTop = sel.offsetTop - list.clientHeight / 2 + sel.clientHeight / 2;
  });
}

function renderGradeModal(m) {

let gradeBreakdownRowSeq = 0;
function gradeBreakdownRowHTML(idx, prefill) {
  prefill = prefill || {};
  return `
  <div class="grade-bd-row" data-bd-idx="${idx}">
    <input id="grade-bd-label-${idx}" class="field-input" placeholder="مثال: سهل" value="${esc(prefill.label || "")}" style="flex:1.3; min-width:0;">

    <input id="grade-bd-wrong-${idx}" type="number" min="0" class="field-input" placeholder="عدد الغلط" value="${prefill.wrong != null ? prefill.wrong : ""}" class="grow">
    <button type="button" onclick="removeGradeBreakdownRow(${idx})" title="حذف" style="background:none;border:none;color:var(--faint);cursor:pointer;padding:4px; flex-shrink:0; font-size:17px; line-height:1;">×</button>

}
function addGradeBreakdownRow() {

  if (!container) return;
  container.insertAdjacentHTML("beforeend", gradeBreakdownRowHTML(gradeBreakdownRowSeq));
}
function removeGradeBreakdownRow(idx) {
