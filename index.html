<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F5F7FB" />
<meta name="description" content="مكتبة الدراسة — خطّط، ادرس، راجع، وتحسّن." />
<title>مكتبة الدراسة</title>
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("sm-theme")||"light")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" />
<style>
/* ===== DESIGN TOKENS (light default / dark) ===== */
:root{--bg:#F5F7FB;--surface:#fff;--surface-2:#F9FAFC;--surface-3:#EDF0F6;--border:#DFE4EC;--border-soft:#E9EDF3;--text:#1A2233;--muted:#5B677B;--faint:#8D97A8;--accent:#2F6FEB;--accent-soft:rgba(47,111,235,.10);--success:#1B9A66;--success-soft:rgba(27,154,102,.11);--warning:#B86E08;--danger:#D64545;--shadow:0 1px 2px rgba(20,30,55,.05),0 4px 14px rgba(20,30,55,.05);--r:14px;color-scheme:light}
:root[data-theme=dark]{--bg:#0E1320;--surface:#151B2B;--surface-2:#1A2133;--surface-3:#222B41;--border:#2B3550;--border-soft:#212A42;--text:#E8ECF5;--muted:#9AA6BD;--faint:#6D7993;--accent:#6E9DFF;--accent-soft:rgba(110,157,255,.15);--success:#3DD39B;--success-soft:rgba(61,211,155,.14);--warning:#F5B04A;--danger:#FF7A7A;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}
html,body{transition:background-color .25s,color .25s}
.shell{display:flex;min-height:100vh}
.side{width:236px;flex-shrink:0;position:sticky;top:0;height:100vh;background:var(--surface);border-inline-end:1px solid var(--border-soft);padding:20px 14px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:4px 10px 18px}
.brand b{width:32px;height:32px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
.nav-i{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;border:0;background:none;font-family:inherit;width:100%;text-align:start}
.nav-i:hover{background:var(--surface-3);color:var(--text)}
.nav-i[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.main{flex:1;min-width:0;padding:26px 28px 90px;max-width:1120px;margin-inline:auto;animation:fadeUp .3s ease}
.bnav{display:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.h1{font-size:24px;font-weight:800;margin:0 0 4px}.h2{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:13.5px}.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface-3);color:var(--muted)}
.chip.warn{background:rgba(214,69,69,.12);color:var(--danger)}.chip.ok{background:var(--success-soft);color:var(--success)}
.hero{background:var(--accent);color:#fff;border:0}.hero .sub,.hero .chip{color:rgba(255,255,255,.85)}.hero .chip{background:rgba(255,255,255,.18)}
.btn-w{background:#fff;color:#1f4fb8;border:0;border-radius:11px;padding:11px 20px;font-weight:700;font-family:inherit;font-size:14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.btn-w:active,.btn-primary:active{transform:scale(.97)}
.bar{height:8px;border-radius:9px;background:var(--surface-3);overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .6s ease}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft)}.row:last-child{border:0}
.ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);background:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;padding:0}
.ck.on{background:var(--success);border-color:var(--success)}
.ib{background:var(--surface-3);border:0;border-radius:9px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;flex-shrink:0}.ib:hover{color:var(--accent)}
.sel,.inp{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:6px 8px;font-family:inherit;font-size:12.5px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:4px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:18px}
.skel{background:linear-gradient(90deg,var(--surface-3),var(--surface-2),var(--surface-3));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px;height:70px}@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13.5px}
.toast{position:fixed;bottom:84px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:11px;font-size:13.5px;z-index:99;animation:fadeUp .25s}
.focus{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.focus .card{width:min(460px,100%);text-align:center;padding:30px 24px}
.ftime{font-family:"IBM Plex Mono",monospace;font-size:68px;font-weight:600;letter-spacing:2px;margin:14px 0}
.lv{display:flex;gap:8px;justify-content:center;margin:12px 0}.lv button{width:42px;height:42px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-weight:700;cursor:pointer;font-family:inherit}.lv button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.mini{display:flex;align-items:flex-end;gap:6px;height:64px}.mini i{flex:1;background:var(--accent);opacity:.85;border-radius:5px 5px 0 0;min-height:3px}
@media(max-width:820px){.side{display:none}.main{padding:18px 14px 96px}.grid2,.grid3{grid-template-columns:1fr}.h1{font-size:20px}
.bnav{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--border);z-index:50;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav button{flex:1;background:none;border:0;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;font-family:inherit;padding:6px 2px;cursor:pointer}.bnav button[aria-current=page]{color:var(--accent)}.ftime{font-size:52px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ico-12{width:12px;height:12px}.ico-18{width:18px;height:18px}

/* ===== legacy component styles (tokens now come from the design system above) ===== */
/* Fonts (Cairo + IBM Plex Mono) are loaded via <link> in index.html, not @import. */


* {
  box-sizing: border-box;
}
html,
body{margin:0;background:var(--bg);color:var(--text);font-family:"Cairo",sans-serif;min-height:100vh}
body {
  margin: 0;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(109, 94, 240, 0.1), transparent 60%),
    radial-gradient(900px 500px at 0% 110%, rgba(53, 208, 160, 0.06), transparent 60%), var(--bg);
  color: var(--text);
  font-family: "Cairo", sans-serif;
  min-height: 100vh;
}
.mono {
  font-family: "IBM Plex Mono", monospace;
}
::-webkit-scrollbar {
  width: 9px;
  height: 9px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 8px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--faint);
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}

.ring {
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.ring::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: conic-gradient(var(--ring-color, var(--accent)) calc(var(--pct, 0) * 1%), var(--border) 0);
  -webkit-mask: radial-gradient(
    farthest-side,
    transparent calc(100% - var(--thick, 8px)),
    #000 calc(100% - var(--thick, 8px))
  );
  mask: radial-gradient(farthest-side, transparent calc(100% - var(--thick, 8px)), #000 calc(100% - var(--thick, 8px)));
}
.sidebar-item {
  transition:
    background 0.15s ease,
    border-color 0.15s ease;
  border-right: 3px solid transparent;
}
.sidebar-item[data-active="true"] {
  background: var(--surface-3);
  border-right-color: var(--accent);
}
.sidebar-item:hover {
  background: var(--surface-2);
}
.file-row,
.folder-card {
  transition:
    background 0.12s ease,
    border-color 0.12s ease;
}
.file-row:hover {
  background: var(--surface-2);
}
.folder-card:hover {
  background: var(--surface-2);
  border-color: var(--accent) !important;
}
.check-btn {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  border: 1.8px solid var(--faint);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
  flex-shrink: 0;
  cursor: pointer;
}
.check-btn[data-done="true"] {
  background: var(--success);
  border-color: var(--success);
}
.sel-check {
  width: 20px;
  height: 20px;
  border-radius: 6px;
  border: 1.8px solid var(--faint);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
  flex-shrink: 0;
  cursor: pointer;
  background: var(--surface);
}
.sel-check[data-checked="true"] {
  background: var(--accent);
  border-color: var(--accent);
}
.badge {
  font-size: 11.5px;
  padding: 3px 9px;
  border-radius: 20px;
  font-weight: 600;
  white-space: nowrap;
}
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(6, 7, 11, 0.72);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  animation: fadeIn 0.15s ease;
  padding: 16px;
}
@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
.modal-card {
  animation: slideUp 0.18s ease;
}
@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.field-input {
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  color: var(--text);
  font-family: "Cairo", sans-serif;
  width: 100%;
  font-size: 14px;
}
.field-input:focus {
  border-color: var(--accent);
}
.field-input::placeholder {
  color: var(--faint);
}
textarea.field-input {
  resize: vertical;
  min-height: 60px;
  font-size: 13px;
}
.swatch {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform 0.12s ease;
}
.swatch[data-selected="true"] {
  transform: scale(1.18);
  border-color: #fff;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
  border-radius: 10px;
  font-weight: 700;
  padding: 10px 18px;
  transition: filter 0.15s ease;
  font-size: 14px;
  border: none;
  cursor: pointer;
}
.btn-primary:hover {
  filter: brightness(1.1);
}
.btn-ghost {
  background: var(--surface-3);
  color: var(--muted);
  border-radius: 10px;
  font-weight: 600;
  padding: 10px 18px;
  transition: background 0.15s ease;
  font-size: 14px;
  border: none;
  cursor: pointer;
}
.btn-ghost:hover {
  background: var(--border);
  color: var(--text);
}
.cat-pill {
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid var(--border);
  transition: all 0.12s ease;
  text-align: center;
}
.cat-pill[data-selected="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: #fff;
}
.hover-actions {
  opacity: 0;
  transition: opacity 0.12s ease;
}
.file-row:hover .hover-actions {
  opacity: 1;
}
.folder-card:hover .hover-actions {
  opacity: 1;
}
.mini-bar {
  height: 6px;
  border-radius: 4px;
  background: var(--border-soft);
  overflow: hidden;
}
.mini-bar > div {
  height: 100%;
  border-radius: 4px;
}
.dash-card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 16px;
}
.tab-btn {
  padding: 9px 18px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 13.5px;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  gap: 7px;
}
.tab-btn[data-active="true"] {
  background: var(--accent);
  color: #fff;
}
.tab-btn[data-active="false"] {
  background: none;
  color: var(--muted);
}
.tab-btn[data-active="false"]:hover {
  background: var(--surface-3);
  color: var(--text);
}
.note-box {
  background: var(--surface-3);
  border: 1px dashed var(--border);
  border-radius: 9px;
  padding: 8px 10px;
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 7px;
  cursor: text;
  white-space: pre-wrap;
}
.rich-note-display {
  background: var(--surface-3);
  border: 1px solid var(--border-soft);
  border-radius: 11px;
  padding: 12px 14px;
  margin-top: 8px;
  font-size: 13px;
  line-height: 1.7;
  color: var(--text);
  position: relative;
}
.rich-note-display.collapsed {
  max-height: 96px;
  overflow: hidden;
}
.rich-note-display.collapsed::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 36px;
  background: linear-gradient(to top, var(--surface-3), transparent);
  border-radius: 0 0 11px 11px;
  pointer-events: none;
}
.note-toggle-btn {
  display: none;
  align-items: center;
  gap: 4px;
  color: var(--accent);
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 6px;
}
.rich-note-display img {
  max-width: 100%;
  border-radius: 8px;
  margin: 6px 0;
  display: block;
}
.rich-note-display ul {
  padding-inline-start: 22px;
  margin: 6px 0;
  list-style: disc;
}
.rich-note-display ol {
  padding-inline-start: 22px;
  margin: 6px 0;
  list-style: decimal;
}
.rich-note-display b,
.rich-note-display strong {
  color: #fff;
}
.rich-note-display p {
  margin: 0 0 6px;
}
.rich-note-display p:last-child {
  margin-bottom: 0;
}
.note-toolbar {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
  margin-bottom: 8px;
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 5px;
}
.note-tool-btn {
  background: none;
  border: none;
  color: var(--muted);
  width: 30px;
  height: 30px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}
.note-tool-btn:hover {
  background: var(--border);
  color: var(--text);
}

.note-tool-btn[data-active="true"] {
  background: var(--accent-soft);
  color: var(--accent);
}

.note-editor {
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  min-height: 160px;
  max-height: 340px;
  overflow-y: auto;
  font-size: 13.5px;
  line-height: 1.7;
}
.note-editor:focus {
  outline: none;
  border-color: var(--accent);
}
.note-editor img {
  max-width: 100%;
  border-radius: 8px;
  margin: 6px 0;
  display: block;
}
.note-editor ul {
  padding-inline-start: 22px;
  margin: 6px 0;
  list-style: disc;
}
.note-editor ol {
  padding-inline-start: 22px;
  margin: 6px 0;
  list-style: decimal;
}
.note-editor:empty:before {
  content: attr(data-placeholder);
  color: var(--faint);
}
.note-frac {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  vertical-align: middle;
  direction: ltr;
  margin: 0 3px;
  font-size: 0.92em;
  line-height: 1.25;
}
.note-frac-num,
.note-frac-den {
  padding: 0 4px;
  min-width: 8px;
  text-align: center;
}
.note-frac-num {
  border-bottom: 1.6px solid currentColor;
}
.note-editor sub,
.note-editor sup,
.rich-note-display sub,
.rich-note-display sup {
  direction: ltr;
  unicode-bidi: isolate;
}
.note-symbols-row {
  display: none;
  flex-wrap: wrap;
  gap: 4px;
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 7px;
  margin-bottom: 8px;
}
.note-symbols-row[data-open="true"] {
  display: flex;
}
.note-sym-btn {
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  color: var(--text);
  min-width: 28px;
  height: 26px;
  padding: 0 5px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  direction: ltr;
  font-family: "IBM Plex Mono", monospace;
}
.note-sym-btn:hover {
  background: var(--border);
  border-color: var(--accent);
}
.import-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border-radius: 9px;
}

.explorer-row {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
.explorer-sidebar {
  width: 230px;
}

@media (max-width: 720px) {
  .explorer-row {
    flex-direction: column;
  }
  .explorer-sidebar {
    width: 100%;
  }
}
.import-row:hover {
  background: var(--surface-3);
}
.crumb {
  color: var(--muted);
  cursor: pointer;
}
.crumb:hover {
  color: var(--text);
}

@keyframes flashHighlight {
  0%,
  100% {
    background: transparent;
  }
  25%,
  75% {
    background: var(--accent-soft);
  }
}
.flash-highlight {
  animation: flashHighlight 1.6s ease;
  border-radius: 11px;
}

/* ============================================================================
   Reusable pieces
   Extracted from styles that were repeated inline across main.js. Anything that
   is *computed from data* (a progress width, a per-category colour) stays inline
   in JS — only fixed presentation lives here.
   ============================================================================ */

/* --- icon sizes (lucide <i> elements) --- */
.ico-11 {
  width: 11px;
  height: 11px;
}
.ico-12 {
  width: 12px;
  height: 12px;
}
.ico-13 {
  width: 13px;
  height: 13px;
}
.ico-14 {
  width: 14px;
  height: 14px;
}
.ico-15 {
  width: 15px;
  height: 15px;
}
.ico-16 {
  width: 16px;
  height: 16px;
}

/* --- form + modal scaffolding --- */
.field-label {
  display: block;
  font-size: 12.5px;
  color: var(--muted);
  margin-bottom: 6px;
}
.field-label-lg {
  margin-bottom: 8px;
}
.field-hint {
  font-size: 11px;
  color: var(--faint);
}
.color-input {
  width: 44px;
  height: 40px;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 2px;
  cursor: pointer;
  background: none;
  flex-shrink: 0;
}
.modal-title {
  font-weight: 800;
  font-size: 16px;
  margin-bottom: 16px;
}
.modal-title-tight {
  margin-bottom: 4px;
}
.modal-subtitle {
  color: var(--muted);
  font-size: 12.5px;
  margin-bottom: 16px;
  min-height: 14px;
}
.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}
.pill-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

/* --- small buttons / icon buttons --- */
.btn-sm {
  padding: 7px 12px;
  font-size: 12.5px;
}
.btn-xs {
  padding: 6px 12px;
  font-size: 12px;
}
.icon-btn {
  background: none;
  border: none;

/* ---------------- cloud storage (Firestore — synced to the user's account) ---------------- */
async function loadDataForUser(uid) {
  state.loaded = false;

  try {
    const docRef = db.collection("users").doc(uid);
    const snap = await docRef.get();
    if (snap.exists) {
      const data = snap.data() || {};
      state.subjects = data.subjects || [];
      state.tasks = data.tasks || [];
      state.history = data.history || [];
      state.platforms = data.platforms || [];
      state.categories =
        data.categories && data.categories.length ? data.categories : DEFAULT_CATEGORIES.map((c) => ({ ...c }));
      state.mistakeTypes =
        data.mistakeTypes && data.mistakeTypes.length
          ? data.mistakeTypes
          : DEFAULT_MISTAKE_TYPES.map((t) => ({ ...t }));
      state.mistakes = data.mistakes || [];
      state.grades = data.grades || [];
      state.plan = data.plan || [];
      state.sessions = data.sessions || [];
      state.prefs = data.prefs || {};
    } else {
      const seed = seedData();
      state.subjects = seed.subjects;
      state.tasks = seed.tasks;
      state.history = seed.history || [];
      state.platforms = seed.platforms || [];
      state.categories = seed.categories;
      state.mistakeTypes = seed.mistakeTypes;
      state.mistakes = seed.mistakes;
      state.grades = seed.grades;
      await docRef.set({
        subjects: state.subjects,
        tasks: state.tasks,
        history: state.history,
        platforms: state.platforms,
        categories: state.categories,
        mistakeTypes: state.mistakeTypes,
        mistakes: state.mistakes,
        grades: state.grades,

  } catch (e) {
    console.error("load failed", e);
    state.loadFailed = true;
    state.subjects = [];
    state.tasks = [];
    state.history = [];
    state.platforms = [];
    state.categories = DEFAULT_CATEGORIES.map((c) => ({ ...c }));
    state.mistakeTypes = DEFAULT_MISTAKE_TYPES.map((t) => ({ ...t }));
    state.mistakes = [];
    state.grades = [];
  }
  if (!state.loadFailed) {}
  state.selectedSubjectId = state.subjects[0] ? state.subjects[0].id : null;
  state.folderPath = [];
  state.loaded = true;
  render();
}

/* ---------------- lookups (recursive — folders can be nested) ---------------- */
function getSubject(id) {
  return state.subjects.find((s) => s.id === id);
}
function findFolderRec(folders, id) {
  for (const f of folders || []) {
    if (f.id === id) return f;
    const found = findFolderRec(f.folders, id);
    if (found) return found;
  }
  return null;
}
function getFolder(subj, id) {
  return subj ? findFolderRec(subj.folders, id) : null;
}
function getFile(folder, id) {
  return folder ? folder.files.find((f) => f.id === id) : null;
}
function resolveTask(t) {
  const subj = getSubject(t.subjectId);
  const folder = getFolder(subj, t.folderId);
  const file = getFile(folder, t.fileId);
  return { subj, folder, file };
}
// container = the object (subject or folder) whose .folders array directly holds folderId
function findFolderContainer(subj, folderId) {
  function search(container) {
    for (const f of container.folders || []) {
      if (f.id === folderId) return container;
      const res = search(f);
      if (res) return res;
    }
    return null;
  }
  return subj ? search(subj) : null;
}

function findFolderPathIds(folders, targetId, trail) {
  for (const f of folders || []) {
    const newTrail = trail.concat(f.id);
    if (f.id === targetId) return newTrail;
    const res = findFolderPathIds(f.folders, targetId, newTrail);
    if (res) return res;
  }
  return null;
}

/* ---------------- drag-and-drop reordering (same-container only — not a move) ----------------
   Reorders siblings within the exact same parent: files within one folder, or folders within
   one parent (another folder, or a subject's root). Moving an item to a *different* folder/subject
   is a separate, deliberate action — the existing "move" button/modal — so a drop is only honoured
   when subjectId+parentId match the dragged item's own; otherwise it's silently ignored. */
let dragState = null; // {type:'file'|'folder', subjectId, parentId, id} — parentId: containing folder id for files; parent folder id, or null for the subject root, for folders
function onRowDragStart(e, type, subjectId, parentId, id) {
  dragState = { type, subjectId, parentId, id };
  e.dataTransfer.effectAllowed = "move";
  try {
    e.dataTransfer.setData("text/plain", id); // Firefox refuses to start a drag without this
  } catch (err) {}
}
function onRowDragOver(e, type, subjectId, parentId, targetId) {
  const d = dragState;
  if (!d || d.type !== type || d.subjectId !== subjectId || d.parentId !== parentId || d.id === targetId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  e.currentTarget.classList.add("drag-over");
}
function onRowDragLeave(e) {
  e.currentTarget.classList.remove("drag-over");
}
function onRowDragEnd() {
  dragState = null;
  document.querySelectorAll(".drag-over").forEach((el) => el.classList.remove("drag-over"));
}
function onRowDrop(e, type, subjectId, parentId, targetId) {
  e.preventDefault();
  e.currentTarget.classList.remove("drag-over");
  const d = dragState;
  dragState = null;
  if (!d || d.type !== type || d.subjectId !== subjectId || d.parentId !== parentId || d.id === targetId) return;
  const subj = getSubject(subjectId);
  const container = type === "folder" ? (parentId ? getFolder(subj, parentId) : subj) : getFolder(subj, parentId);
  const arr = container && (type === "folder" ? container.folders : container.files);
  if (!arr) return;
  const from = arr.findIndex((x) => x.id === d.id);
  const to = arr.findIndex((x) => x.id === targetId);
  if (from === -1 || to === -1) return;
  const [item] = arr.splice(from, 1);
  arr.splice(to, 0, item);
  saveData();
  render();
}
function goToFileInExplorer(subjectId, folderId, fileId) {
  const subj = getSubject(subjectId);
  if (!subj) return;
  state.selectedSubjectId = subjectId;
  state.folderPath = findFolderPathIds(subj.folders, folderId, []) || [];
  state.view = "explorer";
  render();
  setTimeout(() => {
    const el = document.getElementById("file-row-" + fileId);
    if (el) {
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.classList.add("flash-highlight");
      setTimeout(() => el.classList.remove("flash-highlight"), 1600);
    }
  }, 60);
}

function getPathTrail(subj, path) {
  let trail = [],
    folders = subj ? subj.folders : [];
  for (const id of path) {
    const f = (folders || []).find((x) => x.id === id);
    if (!f) break;
    trail.push(f);
    folders = f.folders;
  }
  return trail;
}

/* ---------------- stats (recursive across nested folders) ---------------- */
function collectFiles(folder) {
  let files = folder.files ? [...folder.files] : [];
  (folder.folders || []).forEach((sf) => (files = files.concat(collectFiles(sf))));
  return files;
}
function subjectAllFiles(subj) {
  let files = [];
  (subj.folders || []).forEach((f) => (files = files.concat(collectFiles(f))));
  return files;
}
function collectFilesWithFolder(folder) {
  let items = (folder.files || []).map((f) => ({ folder, file: f }));
  (folder.folders || []).forEach((sf) => {
    items = items.concat(collectFilesWithFolder(sf));
  });
  return items;
}
function subjectAllFilesWithFolder(subj) {
  let items = [];
  (subj.folders || []).forEach((f) => {
    items = items.concat(collectFilesWithFolder(f));
  });
  return items;
}
function getDueReviews() {
  const due = [];
  const now = new Date();
  const todayOnly = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  state.subjects.forEach((subj) => {
    subjectAllFilesWithFolder(subj).forEach(({ folder, file: f }) => {
      if (!f.done || !f.completedAt) return;
      const stage = f.reviewStage || 0;
      if (stage >= REVIEW_INTERVALS_DAYS.length) return;
      const dueDate = new Date(new Date(f.completedAt).getTime() + REVIEW_INTERVALS_DAYS[stage] * 86400000);
      const dueDateOnly = new Date(dueDate.getFullYear(), dueDate.getMonth(), dueDate.getDate());
      if (dueDateOnly <= todayOnly) due.push({ subj, folder, file: f, stage });
    });
  });
  return due;
}
function markReviewDone(subjectId, folderId, fileId) {
  const subj = getSubject(subjectId);
  const folder = getFolder(subj, folderId);
  const f = getFile(folder, fileId);
  if (!f) return;
  f.reviewStage = (f.reviewStage || 0) + 1;
  saveData();
  render();
}
function reviewNoticeStorageKey() {
  return `study-review-notice-dismissed-${state.user ? state.user.uid : "anon"}-${todayStr()}`;
}
function isReviewNoticeDismissed() {
  try {
    return localStorage.getItem(reviewNoticeStorageKey()) === "1";
  } catch (e) {
    return false;
  }
}
function dismissReviewNotice() {
  try {
    localStorage.setItem(reviewNoticeStorageKey(), "1");
  } catch (e) {}
  render();
}
function subjectStats(subj) {
  const excludedCategoryNames = new Set(state.categories.filter((c) => c.countsInOverall === false).map((c) => c.name));
  const files = subjectAllFiles(subj).filter((f) => !(f.category && excludedCategoryNames.has(f.category)));
  const total = files.length,
    done = files.filter((f) => f.done).length;
  return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
}
function taskStats() {
  let total = 0,
    done = 0;
  state.tasks.forEach((t) => {
    const { file } = resolveTask(t);
    if (file) {
      total++;
      if (file.done) done++;
    }
  });
  return { total, done, remaining: total - done, pct: total ? Math.round((done / total) * 100) : 0 };
}

/* ---------------- "الناقص عليك" — everything not done yet, read-only view over the real library ---------------- */
// Unlike state.tasks (files the student has manually chosen to work on), this needs no picking:
// it's derived straight from the subject/folder tree, same exclusion rule as overallStats().
function missingFilesBySubject() {
  const excludedNames = new Set(state.categories.filter((c) => c.countsInOverall === false).map((c) => c.name));
  const taskKey = (subjectId, folderId, fileId) => `${subjectId}|${folderId}|${fileId}`;
  const taskKeys = new Set(state.tasks.map((t) => taskKey(t.subjectId, t.folderId, t.fileId)));
  return state.subjects
    .map((subj) => {
      const items = subjectAllFilesWithFolder(subj)
        .filter(({ file }) => !file.done && !(file.category && excludedNames.has(file.category)))
        .map(({ folder, file }) => ({ folder, file, inTasks: taskKeys.has(taskKey(subj.id, folder.id, file.id)) }));
      return { subject: subj, items };
    })
    .filter((g) => g.items.length > 0);
}

// Plain-text message for sharing outside the app (WhatsApp/notes/etc.) — same grouping as the
// screen: subject (root folder) -> missing file titles, nothing else (no IDs, no links/notes).
function subjectMissingMinutes(g) {
  return g.items.reduce((n, it) => n + fileDurationMin(it.file), 0);
}
function missingTotalMinutes(groups) {
  return groups.reduce((n, g) => n + subjectMissingMinutes(g), 0);
}
function buildMissingReportText() {
  const groups = missingFilesBySubject();
  if (!groups.length) return "مفيش حاجة ناقصة عليك دلوقتي 🎉";
  const lines = ["الناقص عليّ:"];
  groups.forEach((g) => {
    const subjMin = subjectMissingMinutes(g);
    lines.push("", `${g.subject.name} (${g.items.length})${subjMin ? ` — ${formatDurationLong(subjMin)}` : ""}:`);
    g.items.forEach((it) => {
      const m = fileDurationMin(it.file);
      lines.push(`- ${it.file.title}${m ? ` — ${formatDurationLong(m)}` : ""}`);
    });
  });
  const totalMin = missingTotalMinutes(groups);
  if (totalMin) {
    lines.push("", `إجمالي الوقت المتوقع: ${formatDurationLong(totalMin)} (للمهام اللي ليها مدة بس)`);
  }
  return lines.join("\n");
}
async function copyMissingReport() {
  const text = buildMissingReportText();
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    // clipboard API can be blocked (insecure context / permissions) — fall back to a hidden textarea
    try {
      const tmp = document.createElement("textarea");
      tmp.value = text;
      tmp.style.position = "fixed";
      tmp.style.opacity = "0";
      document.body.appendChild(tmp);
      tmp.select();
      ok = document.execCommand("copy");
      document.body.removeChild(tmp);
    } catch (e2) {
      ok = false;
    }
  }
  const label = document.getElementById("missing-copy-label");
  if (!label) return;
  label.textContent = ok ? "اتنسخ ✓" : "معرفتش أنسخ";
  setTimeout(() => {
    const l = document.getElementById("missing-copy-label");
    if (l) l.textContent = "نسخ كرسالة";
  }, 2000);
}

function overallStats() {
  let allFiles = [];
  state.subjects.forEach((s) => {
    allFiles = allFiles.concat(subjectAllFiles(s));
  });
  const excludedCategoryNames = new Set(state.categories.filter((c) => c.countsInOverall === false).map((c) => c.name));
  const countedFiles = allFiles.filter((f) => !(f.category && excludedCategoryNames.has(f.category)));
  const total = countedFiles.length;
  const done = countedFiles.filter((f) => f.done).length;
  const byCategory = {};
  countedFiles.forEach((f) => {
    const cat = f.category || "بدون تصنيف";
    if (!byCategory[cat]) byCategory[cat] = { total: 0, done: 0 };
    byCategory[cat].total++;
    if (f.done) byCategory[cat].done++;
  });
  const orderedNames = state.categories.map((c) => c.name).filter((n) => byCategory[n]);
  const leftoverNames = Object.keys(byCategory).filter((n) => !orderedNames.includes(n));
  const categories = [...orderedNames, ...leftoverNames].map((name) => {
    const { total: catTotal, done: catDone } = byCategory[name];
    return { name, total: catTotal, done: catDone, pct: catTotal ? Math.round((catDone / catTotal) * 100) : 0 };
  });
  return {
    total,
    done,
    remaining: total - done,
    pct: total ? Math.round((done / total) * 100) : 0,
    categories,
    excludedCategoryCount: excludedCategoryNames.size,
  };
}
function excludedCategoriesLabel(n) {
  if (n === 1) return "فيه قسم واحد مستبعد من حساب التقدم الكلي";
  if (n === 2) return "فيه قسمين مستبعدين من حساب التقدم الكلي";
  return `فيه ${n} أقسام مستبعدة من حساب التقدم الكلي`;
}

/* ---------------- cascade cleanup ---------------- */
function pruneOrphanTasks() {
  state.tasks = state.tasks.filter((t) => {
    const { file } = resolveTask(t);
    return !!file;
  });
}

/* ---------------- history (log of what got done, by day) ---------------- */
function recordHistory(subj, folder, file) {
  if (!state.history) state.history = [];
  const today = todayStr();
  const exists = state.history.some((h) => h.fileId === file.id && h.date === today);
  if (exists) return;
  state.history.unshift({
    id: uid(),
    date: today,
    time: new Date().toTimeString().slice(0, 5),
    fileId: file.id,
    title: file.title,
    category: file.category,
    subjectName: subj.name,
    subjectColor: subj.color,
    folderName: folder.name,
  });
}
function unrecordHistoryToday(fileId) {
  const today = todayStr();
  state.history = (state.history || []).filter((h) => !(h.fileId === fileId && h.date === today));
}

}

function addFolder(subjectId, parentFolderId, name) {
  if (!name.trim()) return;

  if (!subj) return;
  const container = parentFolderId ? getFolder(subj, parentFolderId) : subj;
  if (!container) return;
  if (!container.folders) container.folders = [];
  container.folders.push({ id: uid(), name: name.trim(), folders: [], files: [] });
  saveData();
  closeModal();
}
function deleteFolder(subjectId, folderId) {

  if (!container) return;
  container.folders = container.folders.filter((f) => f.id !== folderId);
  pruneOrphanTasks();
  const idx = state.folderPath.indexOf(folderId);
  if (idx !== -1) state.folderPath = state.folderPath.slice(0, idx);

}

  if (!folder) return;

/* ---------------- move (drag-free "file explorer" relocate: files & folders can be
         moved to any folder / subject. Review progress (done/completedAt/reviewStage) lives
         on the file object itself and getDueReviews() walks the live tree each render, so a
         moved file's due-review always resolves to its new, correct location automatically.
         Imported tasks store their own subjectId/folderId snapshot though, so those are
         re-pointed here to keep "المهام" pointing at the right place after a move. ---------------- */
function collectDescendantFolderIds(folder) {
  let ids = [folder.id];
  (folder.folders || []).forEach((sf) => {
    ids = ids.concat(collectDescendantFolderIds(sf));
  });
  return ids;
}
// Silent core movers — no saveData/closeModal/render/navigation, just the data change.
// Return true on success (including a harmless no-op move to the same place), false when skipped (invalid target).
function moveFileToLocation(subjectId, folderId, fileId, targetSubjectId, targetFolderId) {
  const subj = getSubject(subjectId);
  const folder = getFolder(subj, folderId);
  const file = getFile(folder, fileId);
  const targetSubj = getSubject(targetSubjectId);
  const targetFolder = targetSubj ? getFolder(targetSubj, targetFolderId) : null;
  if (!file || !targetFolder) return false;
  if (targetFolder === folder) return true;
  folder.files = folder.files.filter((f) => f.id !== fileId);
  if (!targetFolder.files) targetFolder.files = [];
  targetFolder.files.push(file);
  state.tasks.forEach((t) => {
    if (t.subjectId === subjectId && t.folderId === folderId && t.fileId === fileId) {
      t.subjectId = targetSubjectId;
      t.folderId = targetFolderId;
    }
  });
  return true;
}
function moveFolderToLocation(subjectId, folderId, targetSubjectId, targetParentFolderId) {
  const subj = getSubject(subjectId);
  const folder = getFolder(subj, folderId);
  if (!folder) return false;
  const excluded = collectDescendantFolderIds(folder);
  if (targetParentFolderId && excluded.includes(targetParentFolderId)) return false;
  const container = findFolderContainer(subj, folderId);
  if (!container) return false;
  const targetSubj = getSubject(targetSubjectId);
  if (!targetSubj) return false;
  const targetContainer = targetParentFolderId ? getFolder(targetSubj, targetParentFolderId) : targetSubj;
  if (!targetContainer) return false;
  if (targetContainer === container) return true;
  container.folders = container.folders.filter((f) => f.id !== folderId);
  if (!targetContainer.folders) targetContainer.folders = [];
  targetContainer.folders.push(folder);
  if (targetSubjectId !== subjectId) {
    const fileIds = new Set(collectFiles(folder).map((f) => f.id));
    state.tasks.forEach((t) => {
      if (t.subjectId === subjectId && fileIds.has(t.fileId)) t.subjectId = targetSubjectId;
    });
  }
  return true;
}
// Wrappers used by the per-row move buttons (single item, via the move-file/move-folder modal).
function moveFile(subjectId, folderId, fileId, targetSubjectId, targetFolderId) {
  const ok = moveFileToLocation(subjectId, folderId, fileId, targetSubjectId, targetFolderId);
  if (!ok) {
    closeModal();
    return;
  }
  const targetSubj = getSubject(targetSubjectId);
  state.selectedSubjectId = targetSubjectId;
  state.folderPath = findFolderPathIds(targetSubj.folders, targetFolderId, []) || [];
  saveData();
  closeModal();
  render();
}
function moveFolder(subjectId, folderId, targetSubjectId, targetParentFolderId) {
  const ok = moveFolderToLocation(subjectId, folderId, targetSubjectId, targetParentFolderId);
  if (!ok) {
    closeModal();
    return;
  }
  const targetSubj = getSubject(targetSubjectId);
  state.selectedSubjectId = targetSubjectId;
  state.folderPath = findFolderPathIds(targetSubj.folders, folderId, []) || [];
  saveData();
  closeModal();
  render();
}
// Batch mover for multi-select "نقل المحدد" (move-multi modal).
function moveSelectedTo(targetSubjectId, targetFolderId) {
  const items = state.selectedItems || [];
  let successCount = 0,
    skipCount = 0;
  items.forEach((it) => {
    const ok =
      it.type === "file"
        ? moveFileToLocation(it.subjectId, it.folderId, it.fileId, targetSubjectId, targetFolderId)
        : moveFolderToLocation(it.subjectId, it.folderId, targetSubjectId, targetFolderId);
    ok ? successCount++ : skipCount++;
  });
  saveData();
  state.selectedItems = [];
  state.selectionMode = false;
  const targetSubj = getSubject(targetSubjectId);
  state.selectedSubjectId = targetSubjectId;
  state.folderPath = targetFolderId ? findFolderPathIds(targetSubj.folders, targetFolderId, []) || [] : [];
  closeModal();
  render();
  if (skipCount > 0) {
    setTimeout(
      () => alert(`اتنقل ${successCount} عنصر. ${skipCount} اتجاهلوا (مينفعش تنقل فولدر جوه نفسه أو جوه فرع منه).`),
      50,
    );
  }
}

function toggleSelectItem(type, subjectId, folderId, fileId) {

function stripHtml(html) {
  const div = document.createElement("div");
  div.innerHTML = html || "";

}
function hasNoteContent(f) {
  if (f.noteHtml) return !!stripHtml(f.noteHtml);
  return !!(f.note && f.note.trim());
}
function sanitizeNoteHTML(html) {
  const div = document.createElement("div");
  div.innerHTML = html || "";
  div.querySelectorAll("script, style, iframe, object, embed").forEach((el) => el.remove());
  div.querySelectorAll("*").forEach((el) => {
    [...el.attributes].forEach((attr) => {
      const name = attr.name.toLowerCase();
      const val = (attr.value || "").trim().toLowerCase();
      if (name.startsWith("on")) el.removeAttribute(attr.name);
      if ((name === "href" || name === "src") && val.startsWith("javascript:")) el.removeAttribute(attr.name);
    });
  });
  return div.innerHTML;
}
function saveNoteRich(subjectId, folderId, fileId, html) {

  f.noteHtml = clean;

}
function compressImageFile(file, maxWidth = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width,
          h = img.height;
        if (w > maxWidth) {
          h = Math.round(h * (maxWidth / w));
          w = maxWidth;
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
let noteSavedRange = null;
function saveNoteSelection() {
  const sel = window.getSelection();
  const editor = document.getElementById("note-editor");
  if (sel && sel.rangeCount > 0 && editor && editor.contains(sel.getRangeAt(0).commonAncestorContainer)) {
    noteSavedRange = sel.getRangeAt(0).cloneRange();

}
function restoreNoteSelection() {
  const editor = document.getElementById("note-editor");
  if (!editor) return;
  editor.focus();
  const sel = window.getSelection();
  sel.removeAllRanges();
  if (noteSavedRange) {
    sel.addRange(noteSavedRange);
  } else {
    const range = document.createRange();
    range.selectNodeContents(editor);
    range.collapse(false);
    sel.addRange(range);
  }
}
function insertImageIntoNote(dataUrl) {
  restoreNoteSelection();
  const sel = window.getSelection();
  if (sel.rangeCount === 0) return;
  const range = sel.getRangeAt(0);

  const img = document.createElement("img");
  img.src = dataUrl;
  range.insertNode(img);
  range.setStartAfter(img);
  range.setEndAfter(img);
  sel.removeAllRanges();
  sel.addRange(range);
  noteSavedRange = range.cloneRange();
}

function handleNotePaste(e) {
  const items = (e.clipboardData && e.clipboardData.items) || [];
  for (const item of items) {
    if (item.kind === "file" && item.type.startsWith("image/")) {
      e.preventDefault();
      const file = item.getAsFile();
      saveNoteSelection();
      compressImageFile(file)
        .then(insertImageIntoNote)
        .catch((err) => console.error(err));
      return;
    }
  }
  const html = e.clipboardData && e.clipboardData.getData("text/html");
  if (html && html.trim()) {
    e.preventDefault();
    const cleaned = cleanPastedHTML(html);
    const editor = document.getElementById("note-editor");
    if (editor) editor.focus();
    document.execCommand("insertHTML", false, cleaned || "");
    return;
  }
  // no rich HTML available (e.g. plain unicode text) — let the browser's
  // default plain-text paste happen, this already preserves things like
  // copied ⇌ ² ₂ Δ characters since they're just normal text.
}
// keeps a formula/fraction's structure (bold, sub/sup, tables, images,
// links, our own note-frac fraction spans) when pasted from elsewhere,
// while stripping fonts/colors/junk markup so notes stay consistent.
function cleanPastedHTML(html) {
  const allowedTags = new Set([
    "B",
    "STRONG",
    "I",
    "EM",
    "U",
    "SUB",
    "SUP",
    "BR",
    "P",
    "DIV",
    "UL",
    "OL",
    "LI",
    "SPAN",
    "IMG",
    "A",
    "TABLE",
    "TBODY",
    "TR",
    "TD",
  ]);
  const div = document.createElement("div");
  div.innerHTML = html;
  div.querySelectorAll("script, style, iframe, object, embed, meta, link, head, title").forEach((el) => el.remove());
  const cleanNode = (node) => {
    [...node.childNodes].forEach((child) => {
      if (child.nodeType === 1) {
        if (!allowedTags.has(child.tagName)) {
          while (child.firstChild) child.parentNode.insertBefore(child.firstChild, child);
          child.parentNode.removeChild(child);
          return;
        }
        const isFracPart =
          child.classList.contains("note-frac") ||
          child.classList.contains("note-frac-num") ||
          child.classList.contains("note-frac-den");
        [...child.attributes].forEach((attr) => {
          const name = attr.name.toLowerCase();
          if (name === "class" && isFracPart) return;
          if (child.tagName === "IMG" && name === "src" && !attr.value.trim().toLowerCase().startsWith("javascript:"))
            return;
          if (child.tagName === "A" && name === "href" && !attr.value.trim().toLowerCase().startsWith("javascript:"))
            return;
          child.removeAttribute(attr.name);
        });
        cleanNode(child);
      } else if (child.nodeType !== 3) {
        child.remove();
      }
    });
  };
  cleanNode(div);
  return div.innerHTML;
}

      state.categories =
        data.categories && data.categories.length ? data.categories : DEFAULT_CATEGORIES.map((c) => ({ ...c }));
      state.mistakeTypes =

// Files store their category by NAME (file.category === "واجب"), not by id, so a rename has to
// rewrite every file that referenced the old name — otherwise they all silently lose their
// category (badge disappears, isTest stops applying, grades drop out of قسم الاختبارات).
function renameCategoryOnFiles(oldName, newName) {
  if (oldName === newName) return 0;
  let touched = 0;
  state.subjects.forEach((subj) => {
    subjectAllFiles(subj).forEach((file) => {
      if (file.category === oldName) {
        file.category = newName;
        touched += 1;
      }
    });
  });
  return touched;
}

  return `<div class="ring" style="--pct:${pct}; --ring-color:${color}; --thick:${thick}px; width:${size}px; height:${size}px;">
    <div class="mono" style="position:relative; z-index:1; text-align:center;">
      <div style="font-size:${size * 0.24}px; font-weight:600; color:var(--text); line-height:1;">${pct}%</div>
    </div>
  </div>`;
}
function folderIconSVG(color, size = 16) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" style="flex-shrink:0;"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>`;
}

/* ---------------- main render ---------------- */
function focusModalInput() {
  const ids = {
    subject: "subj-name-input",
    folder: "folder-name-input",
    file: "f-title",
    note: "note-editor",
    platform: "platform-name-input",
    "platform-edit": "platform-name-input",
    "category-edit": "edit-cat-name",
  };
  const id = ids[state.modal.type];
  if (!id) return;
  setTimeout(() => {
    const el = document.getElementById(id);
    if (!el) return;
    el.focus();
    if (el.select) el.select();
    else if (el.id === "note-editor") {
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }, 30);
}

function passwordChangeErrorMessage(e) {
  const code = (e && e.code) || "";
  if (code.includes("wrong-password") || code.includes("invalid-credential")) return "كلمة السر الحالية غلط";
  if (code.includes("weak-password")) return "كلمة السر الجديدة لازم تكون 6 حروف/أرقام على الأقل";
  if (code.includes("requires-recent-login")) return "لازم تسجل خروج وتدخل تاني قبل ما تقدر تغيّر كلمة السر";
  if (code.includes("network-request-failed")) return "مفيش اتصال بالإنترنت";
  return "حصل خطأ، حاول تاني";
}
async function submitPasswordChange() {
  const current = (document.getElementById("pw-current") || {}).value || "";
  const next = (document.getElementById("pw-new") || {}).value || "";
  const confirmPw = (document.getElementById("pw-confirm") || {}).value || "";
  if (!current || !next || !confirmPw) {
    state.settingsPwMsg = "من فضلك املأ كل الحقول";
    state.settingsPwMsgType = "error";
    render();
    return;
  }
  if (next.length < 6) {
    state.settingsPwMsg = "كلمة السر الجديدة لازم تكون 6 حروف/أرقام على الأقل";
    state.settingsPwMsgType = "error";
    render();
    return;
  }
  if (next !== confirmPw) {
    state.settingsPwMsg = "كلمة السر الجديدة والتأكيد مش متطابقين";
    state.settingsPwMsgType = "error";
    render();
    return;
  }
  state.settingsPwBusy = true;
  state.settingsPwMsg = "";
  render();
  try {
    const cred = firebase.auth.EmailAuthProvider.credential(state.user.email, current);
    await auth.currentUser.reauthenticateWithCredential(cred);
    await auth.currentUser.updatePassword(next);
    state.settingsPwMsg = "اتغيرت كلمة السر بنجاح";
    state.settingsPwMsgType = "success";
  } catch (e) {
    state.settingsPwMsg = passwordChangeErrorMessage(e);
    state.settingsPwMsgType = "error";
  }
  state.settingsPwBusy = false;
  render();
}

        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:10px;">
          <div style="display:flex; gap:6px;">
            <div class="cat-pill" data-selected="${state.taskFilter === "all"}" onclick="setTaskFilter('all')">الكل (${state.tasks.length})</div>
            <div class="cat-pill" data-selected="${state.taskFilter === "pending"}" onclick="setTaskFilter('pending')">متبقي (${state.tasks.length - doneCount})</div>
            <div class="cat-pill" data-selected="${state.taskFilter === "done"}" onclick="setTaskFilter('done')">مكتمل (${doneCount})</div>
          </div>
          ${
            doneCount > 0
              ? `<button onclick="clearCompletedTasks()" class="btn-ghost btn-sm row">
                  <i data-lucide="eraser" class="ico-13"></i> امسح المكتملة
                </button>`
              : ""
          }
        </div>
        ${
          filteredTasks.length === 0
            ? `
          <div style="text-align:center; color:var(--faint); padding:30px 20px; border:1.5px dashed var(--border); border-radius:12px;">

          <div style="display:flex; flex-direction:column; gap:6px;">
            ${filteredTasks.map(taskRow).join("")}
          </div>
        `
        }
      `
      }
    </div>
  `;
}

function taskRow(t) {
  const { subj, folder, file } = resolveTask(t);
  if (!file) return "";
  const noteExists = hasNoteContent(file);
  return `
  <div class="file-row" style="display:flex; align-items:flex-start; gap:12px; padding:11px 12px; border:1px solid var(--border-soft); border-radius:11px; ${file.done ? "opacity:0.6;" : ""}">
    <div class="check-btn" data-done="${file.done}" onclick='toggleTaskDone(${JSON.stringify(t)})' style="margin-top:1px;">
      ${file.done ? '<i data-lucide="check" style="width:14px;height:14px;color:#fff;"></i>' : ""}
    </div>
    <div class="grow">
      <div style="font-weight:600; font-size:14px; ${file.done ? "text-decoration:line-through; text-decoration-color:var(--faint);" : ""} overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(file.title)}</div>
      <div style="display:flex; align-items:center; gap:8px; margin-top:5px; flex-wrap:wrap;">
        ${categoryBadgeHTML(file.category, subj)}
        ${durationChipHTML(file)}
        <span class="t-faint-sm">${esc(subj.name)} / ${esc(folder.name)}</span>
        ${file.link ? `<a href="${esc(file.link)}" target="_blank" rel="noopener" style="color:var(--accent); display:flex; align-items:center; gap:3px; font-size:12px; font-weight:600;"><i data-lucide="play-circle" class="ico-12"></i> ادخل الدرس</a>` : ""}
        ${file.pdfLink ? `<a href="${esc(file.pdfLink)}" target="_blank" rel="noopener" style="color:var(--muted); display:flex; align-items:center; gap:3px; font-size:12px;"><i data-lucide="file-text" class="ico-12"></i> PDF</a>` : ""}
        <span onclick="openModal({type:'note', subjectId:'${subj.id}', folderId:'${folder.id}', fileId:'${file.id}'})" style="color:${noteExists ? "var(--warning)" : "var(--faint)"}; cursor:pointer; display:flex; align-items:center; gap:3px; font-size:12px; font-weight:600;"><i data-lucide="sticky-note" class="ico-12"></i> ${noteExists ? "تعديل الملاحظة" : "إضافة ملاحظة"}</span>
      </div>
      ${
        noteExists
          ? `
      <div id="note-display-${file.id}" class="rich-note-display collapsed">${sanitizeNoteHTML(file.noteHtml) || `<p>${esc(file.note)}</p>`}</div>
      <div id="note-toggle-${file.id}" class="note-toggle-btn" onclick="toggleNoteExpand('${file.id}')">
        <span class="note-toggle-label">عرض المزيد</span><i data-lucide="chevron-down" class="ico-12"></i>
      </div>`
          : ""
      }
    </div>
    <button class="hover-actions" onclick="removeTask('${t.id}')" title="إزالة من المهام" style="background:none; border:none; color:var(--faint); cursor:pointer; padding:6px; flex-shrink:0;">
      <i data-lucide="x" class="ico-15"></i>
    </button>
  </div>`;
}

// Renders whatever level of the folder tree the user is currently browsing (subject root,

// as well as files at the same time.
function renderFolderLevel(subj) {
  const path = state.folderPath;
  const trail = getPathTrail(subj, path);
  const folder = trail.length ? trail[trail.length - 1] : null;
  const foldersArr = folder ? folder.folders || [] : subj.folders || [];
  const directFiles = folder ? folder.files || [] : [];
  const doneCount = directFiles.filter((x) => x.done).length;

  const breadcrumbHTML = `

        .map(

/* ---------------- HISTORY VIEW (what got done, grouped by day) ---------------- */
function dateStrToDate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function dateObjToStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function historyStats() {
  const history = state.history || [];
  if (!history.length) return null;
  const dateSet = new Set(history.map((h) => h.date));
  const dates = [...dateSet].sort();
  const firstDate = dates[0];
  const today = todayStr();
  const daysSinceStart = Math.round((dateStrToDate(today) - dateStrToDate(firstDate)) / 86400000) + 1;
  const activeDays = dates.length;
  const emptyDays = Math.max(0, daysSinceStart - activeDays);
  const consistencyPct = daysSinceStart ? Math.round((activeDays / daysSinceStart) * 100) : 0;

  // longest run of back-to-back active days
  let bestStreak = 1,
    run = 1;
  for (let i = 1; i < dates.length; i++) {
    const gap = Math.round((dateStrToDate(dates[i]) - dateStrToDate(dates[i - 1])) / 86400000);
    run = gap === 1 ? run + 1 : 1;
    if (run > bestStreak) bestStreak = run;
  }
  // current run, counted backward from today (still counts if today just hasn't happened yet but yesterday did)
  let currentStreak = 0;
  let cursor = dateSet.has(today)
    ? dateStrToDate(today)
    : (() => {
        const y = dateStrToDate(today);
        y.setDate(y.getDate() - 1);
        return y;
      })();
  while (dateSet.has(dateObjToStr(cursor))) {
    currentStreak += 1;
    cursor.setDate(cursor.getDate() - 1);
  }

  return {
    firstDate,
    daysSinceStart,
    activeDays,
    emptyDays,
    consistencyPct,
    totalTasks: history.length,
    bestStreak,
    currentStreak,
  };
}

function formatDateLabel(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  let label = dt.toLocaleDateString("ar-EG", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  const today = todayStr();
  const yestD = new Date();
  yestD.setDate(yestD.getDate() - 1);
  const yest = `${yestD.getFullYear()}-${String(yestD.getMonth() + 1).padStart(2, "0")}-${String(yestD.getDate()).padStart(2, "0")}`;
  if (dateStr === today) return `اليوم — ${label}`;
  if (dateStr === yest) return `أمس — ${label}`;
  return label;
}

/* ----- duration picker: two scroll lists (hours / minutes) in the app's own pill style ----- */
let pickedDurH = 0;
let pickedDurM = 0;
function durationPickerHTML() {
  const hours = Array.from({ length: 24 }, (_, i) => i);
  const mins = Array.from({ length: 60 }, (_, i) => i);
  const opt = (kind, v, label, sel) =>
    `<div class="dur-opt" data-kind="${kind}" data-val="${v}" data-selected="${sel}" onclick="pickDuration('${kind}',${v})">${label}</div>`;
  return `
    <div class="dur-picker">
      <div class="dur-col">
        <div class="dur-col-label">ساعات</div>
        <div class="dur-list" id="dur-list-h">${hours.map((v) => opt("h", v, v, v === pickedDurH)).join("")}</div>
      </div>
      <div class="dur-sep">:</div>
      <div class="dur-col">
        <div class="dur-col-label">دقائق</div>
        <div class="dur-list" id="dur-list-m">${mins.map((v) => opt("m", v, String(v).padStart(2, "0"), v === pickedDurM)).join("")}</div>
      </div>
    </div>
    <div class="row-between" style="margin-top:8px;">
      <span id="dur-summary" class="t-muted">${durationSummaryText()}</span>
      <span class="t-faint-sm" style="cursor:pointer;" onclick="pickDuration('clear')">مسح</span>
    </div>`;
}
function durationSummaryText() {
  const total = pickedDurH * 60 + pickedDurM;
  return total ? `المدة: ${formatDurationLong(total)}` : "لسه ما اخترتش مدة";
}
function pickDuration(kind, v) {
  if (kind === "clear") {
    pickedDurH = 0;
    pickedDurM = 0;
  } else if (kind === "h") pickedDurH = v;
  else pickedDurM = v;
  document.querySelectorAll(".dur-opt").forEach((el) => {
    const k = el.getAttribute("data-kind");
    const val = Number(el.getAttribute("data-val"));
    el.setAttribute("data-selected", String(k === "h" ? val === pickedDurH : val === pickedDurM));
  });
  const s = document.getElementById("dur-summary");
  if (s) s.textContent = durationSummaryText();
  if (kind === "clear") scrollDurationSelection();
}
// bring the currently selected hour/minute into view inside each list (needs the block to be visible)
function scrollDurationSelection() {
  ["h", "m"].forEach((k) => {
    const list = document.getElementById(`dur-list-${k}`);
    const sel = list && list.querySelector('.dur-opt[data-selected="true"]');
    if (list && sel) list.scrollTop = sel.offsetTop - list.clientHeight / 2 + sel.clientHeight / 2;
  });
}

      subjectId: pickedMistakeSubject || null,
      folderId: folderId || null,
      fileId: fileId || null,

function submitGrade(subjectId, folderId, fileId) {
  if (!fileId) return;
  const subj = getSubject(subjectId);
  const folder = subj ? getFolder(subj, folderId) : null;
  const file = folder ? getFile(folder, fileId) : null;
  if (!file) return;
  const title = file.title;
  const existing = gradeForFile(fileId);
  const totalQuestions = parseInt((document.getElementById("grade-total") || {}).value, 10) || 0;
  const wrongCount = parseInt((document.getElementById("grade-wrong") || {}).value, 10) || 0;
  if (!totalQuestions) {
    alert("اكتب إجمالي عدد الأسئلة");
    return;
  }
  if (wrongCount > totalQuestions) {
    alert("عدد الغلط مينفعش يكون أكبر من إجمالي الأسئلة");
    return;
  }
  const correctCount = totalQuestions - wrongCount;
  const breakdown = [];
  document.querySelectorAll("#grade-breakdown-rows .grade-bd-row").forEach((row) => {
    const idx = row.getAttribute("data-bd-idx");
    const labelEl = document.getElementById(`grade-bd-label-${idx}`);
    const label = labelEl && labelEl.value.trim() ? labelEl.value.trim() : "بدون اسم";
    const total = parseInt((document.getElementById(`grade-bd-total-${idx}`) || {}).value, 10) || 0;
    const wrong = parseInt((document.getElementById(`grade-bd-wrong-${idx}`) || {}).value, 10) || 0;
    if (total > 0) breakdown.push({ label, total, correct: Math.max(0, total - Math.min(wrong, total)) });
  });
  if (existing) {
    existing.title = title;
    existing.totalQuestions = totalQuestions;
    existing.correctCount = correctCount;
    existing.breakdown = breakdown;
    existing.subjectId = subjectId || null;
    existing.folderId = folderId || null;
    existing.updatedAt = new Date().toISOString();
  } else {
    state.grades.push({
      id: uid(),
      title,
      totalQuestions,
      correctCount,
      breakdown,
      subjectId: subjectId || null,
      folderId: folderId || null,
      fileId,
      createdAt: new Date().toISOString(),
    });
  }
  saveData();
  closeModal();
  render();
}
function deleteGrade(id) {
  if (!confirm("حذف الدرجة دي من السجل؟")) return;
  state.grades = state.grades.filter((g) => g.id !== id);
  saveData();
  render();
}
function gradeItemPct(g) {
  return g.totalQuestions ? Math.round((g.correctCount / g.totalQuestions) * 100) : 0;
}
function gradeForFile(fileId) {
  return state.grades.find((g) => g.fileId === fileId) || null;
}
function mistakesForFile(fileId) {
  return state.mistakes.filter((m) => m.fileId === fileId);
}
function gradeBreakdownParts(g) {
  if (Array.isArray(g.breakdown)) return g.breakdown.filter((b) => b && b.total > 0);
  if (g.difficulty) {
    const diffLabel = { easy: "سهل", medium: "متوسط", hard: "صعب" };
    return Object.keys(g.difficulty)
      .filter((k) => g.difficulty[k] && g.difficulty[k].total > 0)
      .map((k) => ({ label: diffLabel[k] || k, total: g.difficulty[k].total, correct: g.difficulty[k].correct }));
  }
  return [];
}

/* ---------------- قسم الاختبارات (tests section) ----------------
   Mirrors the real file/folder tree per subject, filtered to files whose category isTest — no
   separate data model, no artificial "chapter" grouping. One grade per file (edited in place),
   any number of mistakes per file. */
function folderTestItems(subj, folder) {
  return collectFilesWithFolder(folder)
    .filter(({ file }) => isTestFile(file))
    .map(({ folder: ff, file }) => ({ subjectId: subj.id, folderId: ff.id, fileId: file.id, folder: ff, file }));
}
function subjectTestItems(subj) {
  return subjectAllFilesWithFolder(subj)
    .filter(({ file }) => isTestFile(file))
    .map(({ folder, file }) => ({ subjectId: subj.id, folderId: folder.id, fileId: file.id, folder, file }));
}
function allTestItems() {
  let items = [];
  state.subjects.forEach((subj) => {
    items = items.concat(subjectTestItems(subj));
  });
  return items;
}
function testFilesStats(items) {
  let totalQ = 0,
    totalC = 0,
    gradedCount = 0,
    mistakesTotal = 0;
  const mistakeTypeCounts = {};
  // grades are broken down by the FILE's category (واجب / كويز / ...) — there is no separate
  // "grade type" concept any more; the file's own category is the type.
  const catAgg = {};
  items.forEach((it) => {
    const g = gradeForFile(it.fileId);
    if (g) {
      gradedCount++;
      totalQ += g.totalQuestions || 0;
      totalC += g.correctCount || 0;
      const key = it.file.category || "بدون تصنيف";
      if (!catAgg[key]) catAgg[key] = { totalQ: 0, totalC: 0, count: 0 };
      catAgg[key].totalQ += g.totalQuestions || 0;
      catAgg[key].totalC += g.correctCount || 0;
      catAgg[key].count += 1;
    }
    const ms = mistakesForFile(it.fileId);
    mistakesTotal += ms.length;
    ms.forEach((m) => mistakeTypeIdsOf(m).forEach((id) => (mistakeTypeCounts[id] = (mistakeTypeCounts[id] || 0) + 1)));
  });
  const categories = Object.keys(catAgg)
    .map((name) => ({
      name,
      color: getCategoryColor(name),
      count: catAgg[name].count,
      pct: catAgg[name].totalQ ? Math.round((catAgg[name].totalC / catAgg[name].totalQ) * 100) : 0,
    }))
    .sort((a, b) => b.count - a.count);
  const mistakeTypes = state.mistakeTypes
    .map((t) => ({ id: t.id, name: t.name, color: t.color, count: mistakeTypeCounts[t.id] || 0 }))
    .filter((t) => t.count > 0);
  return {
    totalFiles: items.length,
    gradedCount,
    totalQ,
    totalC,
    totalW: totalQ - totalC,
    pct: totalQ ? Math.round((totalC / totalQ) * 100) : 0,
    mistakesTotal,
    mistakeTypes,
    categories,
  };
}

/* full nested tree (all levels stacked, like the file explorer) — each folder is independently

function buildTestFolderNode(subj, folder) {
  const ownFiles = (folder.files || []).filter(isTestFile);
  const children = (folder.folders || []).map((f) => buildTestFolderNode(subj, f)).filter(Boolean);
  if (!ownFiles.length && !children.length) return null;
  return { folder, ownFiles, children, stats: testFilesStats(folderTestItems(subj, folder)) };

  return (subj.folders || []).map((f) => buildTestFolderNode(subj, f)).filter(Boolean);

/* ---------------- move modal (works for both files and folders — shows every subject
         then its folder tree; clicking a valid destination moves the item there immediately) ---------------- */
function renderMoveModal(m) {
  const isMulti = m.type === "move-multi";
  const isFolder = m.type === "move-folder";
  let itemLabel = "";
  let excludeFolderIds = [];
  let currentContainerId = null;
  let hasFiles = false;

  if (isMulti) {
    const items = m.items || [];
    if (!items.length) return "";
    hasFiles = items.some((it) => it.type === "file");
    items
      .filter((it) => it.type === "folder")
      .forEach((it) => {
        const s = getSubject(it.subjectId);
        const f = s ? getFolder(s, it.folderId) : null;
        if (f) excludeFolderIds = excludeFolderIds.concat(collectDescendantFolderIds(f));
      });
    itemLabel = `${items.length} عنصر محدد`;
  } else {
    const subj = getSubject(m.subjectId);
    if (!subj) return "";
    const sourceFolder = getFolder(subj, m.folderId);
    if (!sourceFolder) return "";
    itemLabel = isFolder ? sourceFolder.name : (getFile(sourceFolder, m.fileId) || {}).title || "";
    if (!isFolder && !getFile(sourceFolder, m.fileId)) return "";
    hasFiles = !isFolder;
    excludeFolderIds = isFolder ? collectDescendantFolderIds(sourceFolder) : [];
    const container = isFolder ? findFolderContainer(subj, m.folderId) : null;
    currentContainerId = isFolder ? (container === subj ? null : container.id) : m.folderId;
  }

  function moveCall(targetSubjectId, targetFolderId) {
    const tf = targetFolderId ? `'${targetFolderId}'` : "null";
    if (isMulti) return `moveSelectedTo('${targetSubjectId}',${tf})`;
    return isFolder
      ? `moveFolder('${m.subjectId}','${m.folderId}','${targetSubjectId}',${tf})`
      : `moveFile('${m.subjectId}','${m.folderId}','${m.fileId}','${targetSubjectId}',${tf})`;
  }

  function renderTree(subjParam, folders, depth) {
    return (folders || [])
      .map((f) => {
        if (excludeFolderIds.includes(f.id)) return "";
        const isCurrent = !isMulti && subjParam.id === m.subjectId && f.id === currentContainerId;
        return `
        <div class="import-row" style="padding-right:${10 + depth * 16}px; cursor:${isCurrent ? "default" : "pointer"}; opacity:${isCurrent ? 0.5 : 1};" ${isCurrent ? "" : `onclick="${moveCall(subjParam.id, f.id)}"`}>
          <span style="display:flex; align-items:center; gap:7px; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
            <i data-lucide="folder" style="width:14px;height:14px; color:var(--faint); flex-shrink:0;"></i> ${esc(f.name)}
          </span>
          ${isCurrent ? `<span style="font-size:10.5px; color:var(--faint); flex-shrink:0;">هنا حاليًا</span>` : ""}
        </div>
        ${renderTree(subjParam, f.folders, depth + 1)}`;
      })
      .join("");
  }

  return `
  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-card dash-card" style="width:440px; padding:22px; max-height:82vh; display:flex; flex-direction:column;">
      <div class="modal-title modal-title-tight">${isMulti ? "نقل العناصر المحددة" : isFolder ? "نقل الفولدر" : "نقل الملف"}</div>
      <div style="color:var(--muted); font-size:12.5px; margin-bottom:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(itemLabel)}</div>
      <div style="overflow-y:auto; flex:1; margin:-4px; padding:4px;">
        ${state.subjects
          .map((s) => {
            const rootIsCurrent = !isMulti && isFolder && s.id === m.subjectId && currentContainerId === null;
            const rootClickable = isMulti ? !hasFiles : isFolder && !rootIsCurrent;
            return `
        <div style="margin-bottom:10px;">
          <div class="import-row" style="font-weight:700; font-size:13.5px; color:${s.color}; cursor:${rootClickable ? "pointer" : "default"}; opacity:${rootIsCurrent ? 0.5 : 1};" ${rootClickable ? `onclick="${moveCall(s.id, null)}"` : ""}>
            <span style="display:flex; align-items:center; gap:7px;">${subjectIconHTML(s, 15)} ${esc(s.name)}</span>
            ${isFolder || isMulti ? `<span style="font-size:10.5px; color:var(--faint); flex-shrink:0;">${rootIsCurrent ? "هنا حاليًا" : "جذر المادة"}</span>` : ""}
          </div>
          ${renderTree(s, s.folders, 1)}
        </div>`;
          })
          .join("")}
      </div>
      ${isMulti && hasFiles ? `<div style="font-size:11.5px; color:var(--faint); margin-top:10px;">الملفات المحددة مينفعش تتحط على جذر المادة مباشرة — اختار فولدر</div>` : ""}
      <div style="display:flex; justify-content:flex-end; margin-top:14px;">
        <button class="btn-ghost" onclick="closeModal()">إلغاء</button>
      </div>
    </div>
  </div>`;
}

/* ---------- prefs & small helpers ---------- */
function prefs() {
  state.prefs = state.prefs || {}; const p = state.prefs;
  if (!Array.isArray(p.days)) p.days = [0, 1, 2, 3, 4, 6];
  if (!(p.hours > 0)) p.hours = 3;
  if (!(p.defMin > 0)) p.defMin = 30;
  return p;
}
function addDays(s, n) { const d = dateStrToDate(s); d.setDate(d.getDate() + n); return dateObjToStr(d); }
function dayDiff(a, b) { return Math.round((dateStrToDate(b) - dateStrToDate(a)) / 864e5); }
function pKey(x) { return x.subjectId + "|" + x.folderId + "|" + x.fileId; }
function planItems() { return (state.plan || []).map((x) => Object.assign({ x }, resolveTask(x))).filter((r) => r.file); }
function userName() { return (state.prefs && state.prefs.name) || (state.user && state.user.email ? state.user.email.split("@")[0] : ""); }
function fmtMin(m) { return m >= 60 ? formatDurationShort(Math.round(m)) : Math.round(m) + "د"; }
function sessionMin(from, to) {
  return (state.sessions || []).filter((s) => s.date >= from && s.date <= to).reduce((a, s) => a + s.min, 0);
}

/* ---------- SMART PLANNER ----------
   Candidates = tasks (state.tasks) not yet done. Order: nearest deadline first, then priority, then harder first.
   Each is placed on the first allowed weekday with spare capacity (prefs.hours). Manually placed items are never touched. */
function generatePlan() {
  const p = prefs(), today = todayStr(), cap = p.hours * 60;
  if (!p.days.length) { toast("اختر يوم دراسة واحد على الأقل من الإعدادات"); return; }
  const manual = (state.plan || []).filter((x) => x.manual && !(resolveTask(x).file || { done: true }).done);
  const kept = new Set(manual.map(pKey)), load = {};
  manual.forEach((x) => (load[x.date] = (load[x.date] || 0) + x.min));
  const cands = state.tasks.map((t) => Object.assign({ t }, resolveTask(t))).filter((c) => c.file && !c.file.done && !kept.has(pKey(c.t)));
  const urg = (c) => (c.file.dueDate ? dayDiff(today, c.file.dueDate) : 60) - (c.file.priority || 2) * 4 - (c.file.difficulty || 2) * 1.5;
  cands.sort((a, b) => urg(a) - urg(b));
  const out = manual.slice(); let late = 0;
  cands.forEach((c) => {
    const df = c.file.difficulty || 2, base = fileDurationMin(c.file) || p.defMin;
    const min = Math.max(5, Math.round((base * [0.85, 1, 1.3][df - 1]) / 5) * 5);
    for (let o = 0; o < 365; o++) {
      const d = addDays(today, o);
      if (!p.days.includes(dateStrToDate(d).getDay())) continue;
      if ((load[d] || 0) + min <= cap || !load[d]) {
        load[d] = (load[d] || 0) + min;
        const isLate = c.file.dueDate && d > c.file.dueDate; if (isLate) late++;
        const why = [c.file.dueDate ? "موعدها " + c.file.dueDate : "بدون موعد", "أولوية " + ["", "منخفضة", "متوسطة", "عالية"][c.file.priority || 2]];
        out.push({ id: uid(), subjectId: c.t.subjectId, folderId: c.t.folderId, fileId: c.t.fileId, date: d, min, manual: false, late: !!isLate, why: why.join(" · ") });
        break;
      }
    }
  });
  state.plan = out; saveData(); render();
  toast(late ? `تم التوزيع — ${late} مهمة تتجاوز موعدها، زِد ساعات الدراسة أو الأيام` : "تم توزيع المهام على أيام الدراسة");
}
function setPlanDate(id, date) {
  const x = (state.plan || []).find((i) => i.id === id); if (!x || !date) return;
  x.date = date; x.manual = true; x.late = false; saveData(); render();
}
function postponeItem(id) {
  const x = (state.plan || []).find((i) => i.id === id); if (!x) return;
  const p = prefs(); let d = x.date < todayStr() ? todayStr() : x.date;
  for (let i = 0; i < 30; i++) { d = addDays(d, 1); if (p.days.includes(dateStrToDate(d).getDay())) break; }
  x.date = d; x.manual = true; saveData(); render(); toast("تم التأجيل إلى " + d);
}
function removePlanItem(id) { state.plan = (state.plan || []).filter((i) => i.id !== id); saveData(); render(); }

/* ---------- FOCUS MODE (timestamp based; survives refresh via localStorage) ---------- */
function fkey() { return "sm-focus-" + (state.user ? state.user.uid : "x"); }
function fget() { try { return JSON.parse(localStorage.getItem(fkey())); } catch (e) { return null; } }
function fset(f) { try { f ? localStorage.setItem(fkey(), JSON.stringify(f)) : localStorage.removeItem(fkey()); } catch (e) {} }
function fElapsed(f) { return f.acc + (f.running ? Date.now() - f.t0 : 0); }
function fStudyMs(f) { // Pomodoro: 25 focus + 5 break cycles; breaks are not counted as study time
  const e = fElapsed(f); if (!f.pomo) return e;
  const C = 30 * 6e4, F = 25 * 6e4; return Math.floor(e / C) * F + Math.min(e % C, F);
}
function startFocus(subjectId, folderId, fileId, min) {
  const { subj, file } = resolveTask({ subjectId, folderId, fileId }); if (!file) return;
  if (fget() && !confirm("عندك جلسة مفتوحة. تستبدلها بجلسة جديدة؟")) { state.view = "focus"; render(); return; }
  fset({ subjectId, folderId, fileId, title: file.title, subject: subj.name, color: subj.color, goal: min || 0, acc: 0, t0: Date.now(), running: true, pomo: false });
  state.focusEnding = false; state.view = "focus"; render();
}
function focusToggle() { const f = fget(); if (!f) return; if (f.running) { f.acc += Date.now() - f.t0; f.running = false; } else { f.t0 = Date.now(); f.running = true; } fset(f); render(); }
function focusPomo() { const f = fget(); f.pomo = !f.pomo; fset(f); render(); }
function focusEnd() { const f = fget(); if (f.running) { f.acc += Date.now() - f.t0; f.running = false; fset(f); } state.focusEnding = true; state.fLevel = 3; render(); }
function focusBack() { state.focusEnding = false; render(); }
function focusLevel(n) { state.fLevel = n; render(); }
function focusDiscard() { if (!confirm("إلغاء الجلسة بدون حفظ؟")) return; fset(null); state.focusEnding = false; state.view = "home"; render(); }
function focusSave() {
  const f = fget(); if (!f) return;
  const min = Math.max(1, Math.round(fStudyMs(f) / 6e4));
  const done = !!(document.getElementById("f-done") || {}).checked;
  state.sessions = state.sessions || [];
  state.sessions.unshift({ id: uid(), date: todayStr(), time: new Date().toTimeString().slice(0, 5), min, subjectId: f.subjectId, folderId: f.folderId, fileId: f.fileId, title: f.title, subject: f.subject, focus: state.fLevel || 3, done });
  const { file } = resolveTask(f);
  fset(null); state.focusEnding = false; state.view = "home";
  if (done && file && !file.done) toggleFile(f.subjectId, f.folderId, f.fileId); else { saveData(); render(); }
  toast("تم حفظ الجلسة: " + min + " دقيقة");
}
function focusClock() {
  const f = fget(); const el = document.getElementById("ftime"); if (!f || !el) return;
  const s = Math.floor(fElapsed(f) / 1000), h = Math.floor(s / 3600);
  el.textContent = (h ? String(h).padStart(2, "0") + ":" : "") + String(Math.floor((s % 3600) / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  const ph = document.getElementById("fphase");
  if (ph && f.pomo) { const pos = fElapsed(f) % (30 * 6e4); ph.textContent = pos < 25 * 6e4 ? "تركيز — باقي " + Math.ceil((25 * 6e4 - pos) / 6e4) + " د" : "استراحة — باقي " + Math.ceil((30 * 6e4 - pos) / 6e4) + " د"; }
}
function renderFocus() {
  const f = fget(); if (!f) { state.view = "home"; return renderShell(renderHome()); }
  const mins = Math.round(fStudyMs(f) / 6e4);
  if (state.focusEnding) {
    return `<div class="focus"><div class="card"><div class="h2" style="justify-content:center">انتهت الجلسة</div>
      <div class="sub">${esc(f.subject)} — ${esc(f.title)}</div><div class="ftime" style="font-size:44px">${mins} د</div>
      <div class="sub">كيف كان تركيزك؟</div>

/* ---------- stricter allow-list sanitizer (replaces the legacy one) ---------- */
function sanitizeNoteHTML(html) {
  const OK = new Set("B,STRONG,I,EM,U,S,BR,P,DIV,SPAN,UL,OL,LI,H1,H2,H3,H4,BLOCKQUOTE,CODE,PRE,SUB,SUP,IMG,A,FONT,TABLE,TBODY,THEAD,TR,TD,TH,HR,MARK".split(","));
  const DROP = /^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|SVG|MATH|LINK|META|FORM|INPUT|BUTTON|TEXTAREA|SELECT|BASE)$/;
  const doc = new DOMParser().parseFromString("<body>" + (html || ""), "text/html"); // inert document: nothing executes
  (function walk(n) {
    [...n.children].forEach((el) => {
      if (DROP.test(el.tagName)) { el.remove(); return; }
      if (!OK.has(el.tagName)) { walk(el); el.replaceWith(...el.childNodes); return; }
      [...el.attributes].forEach((a) => {
        const k = a.name.toLowerCase(), v = a.value.replace(/[\s\u0000-\u001f]/g, "").toLowerCase();
        const keep = ["style", "dir", "color", "align", "colspan", "rowspan", "alt", "class"].includes(k) || k.startsWith("data-") ||
          (k === "src" && el.tagName === "IMG" && /^data:image\/(png|jpe?g|webp|gif);base64,/.test(v)) ||
          (k === "href" && el.tagName === "A" && /^(https?:|mailto:)/.test(v));
        if (!keep || (k === "style" && /expression|url\(|javascript|@import/i.test(a.value))) el.removeAttribute(a.name);
      });
      if (el.tagName === "A") { el.setAttribute("target", "_blank"); el.setAttribute("rel", "noopener noreferrer"); }
      walk(el);
    });
  })(doc.body);
  return doc.body.innerHTML;
}
