  if (row) row.remove();
}
function submitGrade(subjectId, folderId, fileId) {
  if (!fileId) return;
  const subj = getSubject(subjectId);
  const folder = subj ? getFolder(subj, folderId) : null;
  const file = folder ? getFile(folder, fileId) : null;
  if (!file) return;
  const title = file.title;
  const existing = gradeForFile(fileId);
  const totalQuestions = parseInt((document.getElementById("grade-total") || {}).value, 10) || 0;
  const wrongCount = parseInt((document.getElementById("grade-wrong") || {}).value, 10) || 0;
  if (!totalQuestions) {
    alert("اكتب إجمالي عدد الأسئلة");
    return;
  }
  if (wrongCount > totalQuestions) {
    alert("عدد الغلط مينفعش يكون أكبر من إجمالي الأسئلة");
    return;
  }
  const correctCount = totalQuestions - wrongCount;
  const breakdown = [];
  document.querySelectorAll("#grade-breakdown-rows .grade-bd-row").forEach((row) => {
    const idx = row.getAttribute("data-bd-idx");
    const labelEl = document.getElementById(`grade-bd-label-${idx}`);
    const label = labelEl && labelEl.value.trim() ? labelEl.value.trim() : "بدون اسم";
    const total = parseInt((document.getElementById(`grade-bd-total-${idx}`) || {}).value, 10) || 0;
    const wrong = parseInt((document.getElementById(`grade-bd-wrong-${idx}`) || {}).value, 10) || 0;
    if (total > 0) breakdown.push({ label, total, correct: Math.max(0, total - Math.min(wrong, total)) });
  });
  if (existing) {
    existing.title = title;
    existing.totalQuestions = totalQuestions;
    existing.correctCount = correctCount;
    existing.breakdown = breakdown;
    existing.subjectId = subjectId || null;
    existing.folderId = folderId || null;
    existing.updatedAt = new Date().toISOString();
  } else {
    state.grades.push({
      id: uid(),
      title,
      totalQuestions,
      correctCount,
      breakdown,
      subjectId: subjectId || null,
      folderId: folderId || null,
      fileId,
      createdAt: new Date().toISOString(),
    });
  }
  saveData();
  closeModal();
  render();
}
function deleteGrade(id) {
  if (!confirm("حذف الدرجة دي من السجل؟")) return;
  state.grades = state.grades.filter((g) => g.id !== id);
  saveData();
  render();
}
function gradeItemPct(g) {
  return g.totalQuestions ? Math.round((g.correctCount / g.totalQuestions) * 100) : 0;
}
function gradeForFile(fileId) {
  return state.grades.find((g) => g.fileId === fileId) || null;
}
function mistakesForFile(fileId) {
  return state.mistakes.filter((m) => m.fileId === fileId);
}
function gradeBreakdownParts(g) {
  if (Array.isArray(g.breakdown)) return g.breakdown.filter((b) => b && b.total > 0);
  if (g.difficulty) {
    const diffLabel = { easy: "سهل", medium: "متوسط", hard: "صعب" };
    return Object.keys(g.difficulty)
      .filter((k) => g.difficulty[k] && g.difficulty[k].total > 0)
      .map((k) => ({ label: diffLabel[k] || k, total: g.difficulty[k].total, correct: g.difficulty[k].correct }));
  }
  return [];
}

/* ---------------- قسم الاختبارات (tests section) ----------------
   Mirrors the real file/folder tree per subject, filtered to files whose category isTest — no
   separate data model, no artificial "chapter" grouping. One grade per file (edited in place),
   any number of mistakes per file. */
function folderTestItems(subj, folder) {
  return collectFilesWithFolder(folder)
    .filter(({ file }) => isTestFile(file))
    .map(({ folder: ff, file }) => ({ subjectId: subj.id, folderId: ff.id, fileId: file.id, folder: ff, file }));
}
function subjectTestItems(subj) {
  return subjectAllFilesWithFolder(subj)
    .filter(({ file }) => isTestFile(file))
    .map(({ folder, file }) => ({ subjectId: subj.id, folderId: folder.id, fileId: file.id, folder, file }));
}
function allTestItems() {
  let items = [];
  state.subjects.forEach((subj) => {
    items = items.concat(subjectTestItems(subj));
  });
  return items;
}
function testFilesStats(items) {
  let totalQ = 0,
    totalC = 0,
    gradedCount = 0,
    mistakesTotal = 0;
  const mistakeTypeCounts = {};
  // grades are broken down by the FILE's category (واجب / كويز / ...) — there is no separate
  // "grade type" concept any more; the file's own category is the type.
  const catAgg = {};
  items.forEach((it) => {
    const g = gradeForFile(it.fileId);
    if (g) {
      gradedCount++;
      totalQ += g.totalQuestions || 0;
      totalC += g.correctCount || 0;
      const key = it.file.category || "بدون تصنيف";
      if (!catAgg[key]) catAgg[key] = { totalQ: 0, totalC: 0, count: 0 };
      catAgg[key].totalQ += g.totalQuestions || 0;
      catAgg[key].totalC += g.correctCount || 0;
      catAgg[key].count += 1;
    }
    const ms = mistakesForFile(it.fileId);
    mistakesTotal += ms.length;
    ms.forEach((m) => mistakeTypeIdsOf(m).forEach((id) => (mistakeTypeCounts[id] = (mistakeTypeCounts[id] || 0) + 1)));
  });
  const categories = Object.keys(catAgg)
    .map((name) => ({
      name,
      color: getCategoryColor(name),
      count: catAgg[name].count,
      pct: catAgg[name].totalQ ? Math.round((catAgg[name].totalC / catAgg[name].totalQ) * 100) : 0,
    }))
    .sort((a, b) => b.count - a.count);
  const mistakeTypes = state.mistakeTypes
    .map((t) => ({ id: t.id, name: t.name, color: t.color, count: mistakeTypeCounts[t.id] || 0 }))
    .filter((t) => t.count > 0);
  return {
    totalFiles: items.length,
    gradedCount,
    totalQ,
    totalC,
    totalW: totalQ - totalC,
    pct: totalQ ? Math.round((totalC / totalQ) * 100) : 0,
    mistakesTotal,
    mistakeTypes,
    categories,
  };
}

/* full nested tree (all levels stacked, like the file explorer) — each folder is independently

  const ownFiles = (folder.files || []).filter(isTestFile);
  const children = (folder.folders || []).map((f) => buildTestFolderNode(subj, f)).filter(Boolean);
  if (!ownFiles.length && !children.length) return null;
  return { folder, ownFiles, children, stats: testFilesStats(folderTestItems(subj, folder)) };
}

  return (subj.folders || []).map((f) => buildTestFolderNode(subj, f)).filter(Boolean);

      </div>
      <div style="display:flex; align-items:center; gap:10px; flex-shrink:0;">
        ${grade ? `<span class="mono" style="font-size:12px; font-weight:700; padding:3px 9px; border-radius:20px; background:${pct >= 50 ? "var(--success-soft)" : "rgba(242,121,91,0.14)"}; color:${pct >= 50 ? "var(--success)" : "#F2795B"};">${grade.correctCount}/${grade.totalQuestions} · ${pct}%</span>` : `<span class="t-faint-sm">بدون درجة</span>`}
        ${mistakes.length ? `<span style="display:flex; align-items:center; gap:3px; color:var(--warning); font-size:12px; font-weight:600;"><i data-lucide="alert-triangle" class="ico-12"></i>${mistakes.length}</span>` : ""}
        <i data-lucide="${isOpen ? "chevron-up" : "chevron-down"}" style="width:15px;height:15px; color:var(--faint);"></i>
      </div>
    </div>
    ${isOpen ? renderTestsFileDetail(subj, folder, f, grade, mistakes) : ""}
  </div>`;
}
function renderTestsFileDetail(subj, folder, f, grade, mistakes) {
  const diffParts = grade ? gradeBreakdownParts(grade) : [];
  return `
  <div style="padding:2px 12px 14px; border-top:1px solid var(--border-soft);">
    ${
      diffParts.length
        ? `<div style="display:flex; gap:12px; flex-wrap:wrap; margin:10px 0 0;">
            ${diffParts.map((d) => `<span class="mono" style="font-size:11px; color:var(--faint);">${esc(d.label)}: ${d.correct}/${d.total}</span>`).join("")}
          </div>`
        : ""
    }
    <div style="margin-top:12px; margin-bottom:8px; font-size:12px; font-weight:700; color:var(--muted);">الأخطاء (${mistakes.length})</div>
    ${
      mistakes.length
        ? `<div style="display:flex; flex-direction:column; gap:8px;">${mistakes
            .slice()
            .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
            .map(renderMistakeRow)
            .join("")}</div>`
        : `<div style="font-size:12px; color:var(--faint); margin-bottom:4px;">لا توجد أخطاء مسجلة على هذا الملف</div>`
    }
    <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
      <button class="btn-ghost" style="font-size:12px; padding:7px 12px; display:flex; align-items:center; gap:5px;" onclick="openModal({type:'grade', subjectId:'${subj.id}', folderId:'${folder.id}', fileId:'${f.id}'})">
        <i data-lucide="clipboard-check" class="ico-12"></i> ${grade ? "تعديل الدرجة" : "تسجيل الدرجة"}
      </button>
      ${
        grade
          ? `<button class="btn-ghost" style="font-size:12px; padding:7px 12px; display:flex; align-items:center; gap:5px; color:#F2795B;" onclick="deleteGrade('${grade.id}')">
              <i data-lucide="trash-2" class="ico-12"></i> حذف الدرجة
            </button>`
          : ""
      }
      <button class="btn-ghost" style="font-size:12px; padding:7px 12px; display:flex; align-items:center; gap:5px;" onclick="openModal({type:'mistake', subjectId:'${subj.id}', folderId:'${folder.id}', fileId:'${f.id}'})">
        <i data-lucide="plus" class="ico-12"></i> إضافة خطأ
      </button>
    </div>
  </div>`;
}
function submitFile(subjectId, folderId, fileId) {
  const title = document.getElementById("f-title").value;
  if (!title.trim()) {
    document.getElementById("f-title").focus();
    return;
  }
  const link = document.getElementById("f-link").value.trim();
  const pdfLink = document.getElementById("f-pdf").value.trim();
  const note = document.getElementById("f-note").value.trim();
  const hasDur = categoryHasDuration(state.categories.find((x) => x.name === pickedCategory));
  const durationMin = hasDur ? pickedDurH * 60 + pickedDurM : 0;
  saveFile(subjectId, folderId, fileId, { title: title.trim(), category: pickedCategory, link, pdfLink, note, durationMin });
}

function renderImportModal() {
  const hasAnyFiles = state.subjects.some((s) => subjectAllFiles(s).length > 0);
  return `
  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-card dash-card" style="width:460px; padding:22px; max-height:82vh; display:flex; flex-direction:column;">
      <div class="modal-title" style="margin-bottom:14px;">استيراد ملف كمهمة</div>
      <div style="overflow-y:auto; flex:1; margin:-4px; padding:4px;">
        ${
          !hasAnyFiles
            ? `<div style="color:var(--faint); font-size:13px; text-align:center; padding:30px 0;">لا توجد مواد أو ملفات بعد. أضف من "الملفات والمواد" أولًا.</div>`
            : state.subjects
                .map((subj) => {
                  if (subjectAllFiles(subj).length === 0) return "";
                  return `
          <div style="margin-bottom:14px;">
            <div style="display:flex; align-items:center; gap:7px; font-weight:700; font-size:13.5px; margin-bottom:6px; color:${subj.color};">
              ${subjectIconHTML(subj, 15)} ${esc(subj.name)}
            </div>
            ${renderImportFolders(subj, subj.folders, 0)}
          </div>`;
                })
                .join("")
        }
      </div>
      <div style="display:flex; justify-content:flex-end; margin-top:14px;">
        <button class="btn-ghost" onclick="closeModal()">تم</button>
      </div>
    </div>
  </div>`;
}
function renderImportFolders(subj, folders, depth) {
  if (!folders || folders.length === 0) return "";
  return folders
    .map((folder) => {
      const hasContent = folder.files.length > 0 || (folder.folders && folder.folders.length > 0);
      if (!hasContent) return "";
      return `
      <div style="margin-bottom:8px; padding-right:${14 + depth * 14}px;">
        <div style="font-size:12px; color:var(--muted); font-weight:600; margin-bottom:3px;">${esc(folder.name)}</div>
        ${
          folder.files.length === 0
            ? ""
            : folder.files
                .map((f) => {
                  const already = state.tasks.some(
                    (t) => t.fileId === f.id && t.folderId === folder.id && t.subjectId === subj.id,
                  );
                  return `
          <div class="import-row">
            <span style="font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(f.title)}</span>
            ${
              already
                ? `<span style="font-size:11px; color:var(--success); display:flex; align-items:center; gap:3px; flex-shrink:0;"><i data-lucide="check" class="ico-12"></i> مستوردة</span>`
                : `<button onclick="importTask('${subj.id}','${folder.id}','${f.id}')" style="background:var(--accent-soft); color:var(--accent); border:none; border-radius:8px; padding:4px 10px; font-size:11.5px; font-weight:700; cursor:pointer; flex-shrink:0;">+ استيراد</button>`
            }
          </div>`;
                })
                .join("")
        }
        ${renderImportFolders(subj, folder.folders, depth + 1)}
      </div>`;
    })
    .join("");
}

/* ---------------- move modal (works for both files and folders — shows every subject
         then its folder tree; clicking a valid destination moves the item there immediately) ---------------- */
function renderMoveModal(m) {
  const isMulti = m.type === "move-multi";
  const isFolder = m.type === "move-folder";
  let itemLabel = "";
  let excludeFolderIds = [];
  let currentContainerId = null;
  let hasFiles = false;

  if (isMulti) {
    const items = m.items || [];
    if (!items.length) return "";
    hasFiles = items.some((it) => it.type === "file");
    items
      .filter((it) => it.type === "folder")
      .forEach((it) => {
        const s = getSubject(it.subjectId);
        const f = s ? getFolder(s, it.folderId) : null;
        if (f) excludeFolderIds = excludeFolderIds.concat(collectDescendantFolderIds(f));
      });
    itemLabel = `${items.length} عنصر محدد`;
  } else {
    const subj = getSubject(m.subjectId);
    if (!subj) return "";
    const sourceFolder = getFolder(subj, m.folderId);
    if (!sourceFolder) return "";
    itemLabel = isFolder ? sourceFolder.name : (getFile(sourceFolder, m.fileId) || {}).title || "";
    if (!isFolder && !getFile(sourceFolder, m.fileId)) return "";
    hasFiles = !isFolder;
    excludeFolderIds = isFolder ? collectDescendantFolderIds(sourceFolder) : [];
    const container = isFolder ? findFolderContainer(subj, m.folderId) : null;
    currentContainerId = isFolder ? (container === subj ? null : container.id) : m.folderId;
  }

  function moveCall(targetSubjectId, targetFolderId) {
    const tf = targetFolderId ? `'${targetFolderId}'` : "null";
    if (isMulti) return `moveSelectedTo('${targetSubjectId}',${tf})`;
    return isFolder
      ? `moveFolder('${m.subjectId}','${m.folderId}','${targetSubjectId}',${tf})`
      : `moveFile('${m.subjectId}','${m.folderId}','${m.fileId}','${targetSubjectId}',${tf})`;
  }

  function renderTree(subjParam, folders, depth) {
    return (folders || [])
      .map((f) => {
        if (excludeFolderIds.includes(f.id)) return "";
        const isCurrent = !isMulti && subjParam.id === m.subjectId && f.id === currentContainerId;
        return `
        <div class="import-row" style="padding-right:${10 + depth * 16}px; cursor:${isCurrent ? "default" : "pointer"}; opacity:${isCurrent ? 0.5 : 1};" ${isCurrent ? "" : `onclick="${moveCall(subjParam.id, f.id)}"`}>
          <span style="display:flex; align-items:center; gap:7px; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
            <i data-lucide="folder" style="width:14px;height:14px; color:var(--faint); flex-shrink:0;"></i> ${esc(f.name)}
          </span>
          ${isCurrent ? `<span style="font-size:10.5px; color:var(--faint); flex-shrink:0;">هنا حاليًا</span>` : ""}
        </div>
        ${renderTree(subjParam, f.folders, depth + 1)}`;
      })
      .join("");
  }

  return `
  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-card dash-card" style="width:440px; padding:22px; max-height:82vh; display:flex; flex-direction:column;">
      <div class="modal-title modal-title-tight">${isMulti ? "نقل العناصر المحددة" : isFolder ? "نقل الفولدر" : "نقل الملف"}</div>
      <div style="color:var(--muted); font-size:12.5px; margin-bottom:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(itemLabel)}</div>
      <div style="overflow-y:auto; flex:1; margin:-4px; padding:4px;">
        ${state.subjects
          .map((s) => {
            const rootIsCurrent = !isMulti && isFolder && s.id === m.subjectId && currentContainerId === null;
            const rootClickable = isMulti ? !hasFiles : isFolder && !rootIsCurrent;
            return `
        <div style="margin-bottom:10px;">
          <div class="import-row" style="font-weight:700; font-size:13.5px; color:${s.color}; cursor:${rootClickable ? "pointer" : "default"}; opacity:${rootIsCurrent ? 0.5 : 1};" ${rootClickable ? `onclick="${moveCall(s.id, null)}"` : ""}>
            <span style="display:flex; align-items:center; gap:7px;">${subjectIconHTML(s, 15)} ${esc(s.name)}</span>
            ${isFolder || isMulti ? `<span style="font-size:10.5px; color:var(--faint); flex-shrink:0;">${rootIsCurrent ? "هنا حاليًا" : "جذر المادة"}</span>` : ""}
          </div>
          ${renderTree(s, s.folders, 1)}
        </div>`;
          })
          .join("")}
      </div>
      ${isMulti && hasFiles ? `<div style="font-size:11.5px; color:var(--faint); margin-top:10px;">الملفات المحددة مينفعش تتحط على جذر المادة مباشرة — اختار فولدر</div>` : ""}
      <div style="display:flex; justify-content:flex-end; margin-top:14px;">
        <button class="btn-ghost" onclick="closeModal()">إلغاء</button>
      </div>
    </div>
  </div>`;
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.modal) closeModal();
  // Enter inside a single-line <input> in an open modal triggers that modal's
  // primary (save/add) button — matches normal dialog-box UX. Textareas and the
  // rich-text note editor (both non-<input>) are excluded on purpose so Enter still
  // inserts a new line there instead of submitting.
  if (e.key === "Enter" && e.target.tagName === "INPUT" && e.target.type !== "color") {
    const card = e.target.closest(".modal-card");
    if (card) {
      const btn = card.querySelector(".btn-primary");
      if (btn) {
        e.preventDefault();
        btn.click();
      }
    }
  }
});

render();

</script>
</body>
</html>
